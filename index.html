<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>花瓣游戏 - 终极版</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; touch-action: none; user-select: none; font-family: sans-serif; color: #fff; }
  canvas { display: block; }
  
  /* UI 基础按钮样式 */
  .ui-btn { position: fixed; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; font-weight: bold; z-index: 10; border-radius: 50%; transition: background 0.1s; }
  .ui-btn:active, .ui-btn.active { background: rgba(255,255,255,0.4); }
  
  /* 按键大小位置 */
  #btnA { width: 70px; height: 70px; bottom: 30px; right: 120px; font-size: 28px; }
  #btnB { width: 70px; height: 70px; bottom: 110px; right: 30px; font-size: 28px; }
  
  /* 设置齿轮 */
  #btnSettings { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; border-radius: 10px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 100; cursor: pointer; }
  
  /* 设置面板 */
  #settingsPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 350px; background: rgba(30, 30, 50, 0.95); border: 2px solid #4dabf7; border-radius: 15px; padding: 20px; z-index: 200; display: none; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  #settingsPanel h2 { margin: 0 0 10px 0; text-align: center; color: #4dabf7; font-size: 20px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .setting-row button { padding: 6px 12px; border-radius: 5px; border: none; background: #4dabf7; color: #fff; font-weight: bold; cursor: pointer; min-width: 80px; }
  .setting-row button.off { background: #555; }
  #closeSettings { margin-top: 10px; padding: 10px; border-radius: 8px; border: none; background: #ff6b9d; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
  
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- 右下角技能键 -->
<div id="btnA" class="ui-btn">A</div>
<div id="btnB" class="ui-btn">B</div>

<!-- 右上角设置按钮 -->
<div id="btnSettings">⚙️</div>

<!-- 设置面板 -->
<div id="settingsPanel">
  <h2>游戏设置</h2>
  <div class="setting-row">
    <span>摇杆模式</span>
    <button id="setJoyMode">动态</button>
  </div>
  <div class="setting-row">
    <span>按键模式</span>
    <button id="setKeyMode">长按</button>
  </div>
  <div class="setting-row">
    <span>屏幕方向</span>
    <button id="setScreen">自由</button>
  </div>
  <div class="setting-row">
    <span>摇杆外观</span>
    <button id="setJoyLook">有摇杆头</button>
  </div>
  <div class="setting-row">
    <span>卫星箭头</span>
    <button id="setArrow">显示</button>
  </div>
  <div class="setting-row">
    <span>隐藏按键/UI</span>
    <button id="setUI">显示</button>
  </div>
  <button id="closeSettings">完成</button>
</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H;
function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ================= 设置状态 =================
let settings = {
  joyMode: 'dynamic',  // 'dynamic' | 'fixed'
  keyMode: 'hold',     // 'hold' | 'click'
  screen: 'free',      // 'free' | 'landscape' | 'portrait'
  joyLook: 'head',     // 'head' | 'nohead'
  showArrow: true,
  showUI: true
};

// UI 元素
const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const btnSettings = document.getElementById('btnSettings');
const settingsPanel = document.getElementById('settingsPanel');
const closeBtn = document.getElementById('closeSettings');

// 设置面板交互
btnSettings.onclick = () => settingsPanel.style.display = 'flex';
closeBtn.onclick = () => {
  settingsPanel.style.display = 'none';
  applyScreenOrientation();
};

const btnSetJoy = document.getElementById('setJoyMode');
const btnSetKey = document.getElementById('setKeyMode');
const btnSetScreen = document.getElementById('setScreen');
const btnSetLook = document.getElementById('setJoyLook');
const btnSetArrow = document.getElementById('setArrow');
const btnSetUI = document.getElementById('setUI');

function updateUIButtons() {
  btnSetJoy.innerText = settings.joyMode === 'dynamic' ? '动态' : '固定';
  btnSetKey.innerText = settings.keyMode === 'hold' ? '长按' : '点击';
  btnSetScreen.innerText = settings.screen === 'free' ? '自由' : (settings.screen === 'landscape' ? '横屏' : '竖屏');
  btnSetLook.innerText = settings.joyLook === 'head' ? '有摇杆头' : '无摇杆头';
  btnSetArrow.innerText = settings.showArrow ? '显示' : '隐藏';
  btnSetUI.innerText = settings.showUI ? '显示' : '隐藏';

  // 处理 UI 隐藏
  const els = [btnA, btnB];
  els.forEach(el => settings.showUI ? el.classList.remove('hidden') : el.classList.add('hidden'));
}

btnSetJoy.onclick = () => { settings.joyMode = settings.joyMode === 'dynamic' ? 'fixed' : 'dynamic'; updateUIButtons(); resetJoy(); };
btnSetKey.onclick = () => { settings.keyMode = settings.keyMode === 'hold' ? 'click' : 'hold'; updateUIButtons(); };
btnSetScreen.onclick = () => {
  settings.screen = settings.screen === 'free' ? 'landscape' : (settings.screen === 'landscape' ? 'portrait' : 'free');
  updateUIButtons();
};
btnSetLook.onclick = () => { settings.joyLook = settings.joyLook === 'head' ? 'nohead' : 'head'; updateUIButtons(); };
btnSetArrow.onclick = () => { settings.showArrow = !settings.showArrow; updateUIButtons(); };
btnSetUI.onclick = () => { settings.showUI = !settings.showUI; updateUIButtons(); };

function applyScreenOrientation() {
  if (settings.screen === 'landscape') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  } else if (settings.screen === 'portrait') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
  } else {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
}
updateUIButtons();

// ================= 玩家移动物理 =================
const P = {
  x: W/2, y: H/2, r: 16, vx: 0, vy: 0,
  accel: 0.6, friction: 0.92, maxSpeed: 7,
  hp: 100, mhp: 100, pts: [], n: 5, ang: 0, fl: 0, face: 0
};

function initP(n) {
  P.pts = [];
  for (let i = 0; i < n; i++) P.pts.push({ o: i * (Math.PI * 2 / n), cd: 0, r: 10 });
}
initP(P.n);

// ================= 摇杆逻辑 =================
let joy = { act: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, id: null };
let JR = 60, KR = 30, FX = 100, FY = H - 120;

function resetJoy() {
  joy.act = false; joy.dx = 0; joy.dy = 0; joy.id = null;
}

cvs.addEventListener('touchstart', e => {
  if(!settings.showUI) return;
  const t = e.changedTouches[0];
  const tx = t.clientX;
  const ty = t.clientY;
  
  // 排除点击右侧区域
  if (tx > W - 180 && ty > H - 180) return; 

  if (joy.act) return;
  if (settings.joyMode === 'fixed') {
    joy.bx = FX; joy.by = FY; joy.kx = FX; joy.ky = FY;
  } else {
    joy.bx = tx; joy.by = ty; joy.kx = tx; joy.ky = ty;
  }
  joy.act = true;
  joy.id = t.identifier;
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joy.act) return;
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.bx;
      let dy = t.clientY - joy.by;
      const dist = Math.hypot(dx, dy);
      if (dist > JR) { dx = (dx / dist) * JR; dy = (dy / dist) * JR; }
      joy.kx = joy.bx + dx;
      joy.ky = joy.by + dy;
      joy.dx = dx / JR;
      joy.dy = dy / JR;
    }
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joy.id) resetJoy();
  }
});
cvs.addEventListener('touchcancel', resetJoy);


// ================= A/B 键逻辑 =================
let currentPetalRadius = 46;
const maxPetalRadius = 90;
const minPetalRadius = 25;
let isALong = false, isBLong = false;
let isAClicked = false, isBClicked = false;

function handleDown(isA) {
  if (settings.keyMode === 'hold') {
    if (isA) isALong = true; else isBLong = true;
  } else {
    if (isA) { isAClicked = !isAClicked; if(isAClicked) isBClicked = false; }
    else { isBClicked = !isBClicked; if(isBClicked) isAClicked = false; }
  }
}
function handleUp(isA) {
  if (settings.keyMode === 'hold') {
    if (isA) isALong = false; else isBLong = false;
  }
}

btnA.addEventListener('touchstart', e => { e.preventDefault(); handleDown(true); });
btnA.addEventListener('touchend', e => { e.preventDefault(); handleUp(true); });
btnB.addEventListener('touchstart', e => { e.preventDefault(); handleDown(false); });
btnB.addEventListener('touchend', e => { e.preventDefault(); handleUp(false); });


// ================= 游戏主循环 =================
const rnd = (a, b) => a + Math.random() * (b - a);
const dst = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const M = [], D = [];

function spawn() {
  let e = Math.floor(rnd(0, 4)), x, y;
  if (e == 0) { x = rnd(0, W); y = -30; }
  else if (e == 1) { x = rnd(0, W); y = H + 30; }
  else if (e == 2) { x = -30; y = rnd(0, H); }
  else { x = W + 30; y = rnd(0, H); }
  M.push({ x, y, r: rnd(12, 20), hp: 30, mhp: 30, sp: rnd(.6, 1.2), c: `hsl(${rnd(0, 360)},70%,55%)`, fl: 0, acd: 0 });
}

let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 16.67, 2);
  last = now;
  upd(dt);
  draw();
  requestAnimationFrame(loop);
}

function upd(dt) {
  // 1. 处理 A/B 键花瓣半径变化
  let targetRadius = 46;
  if (isALong || isAClicked) targetRadius = maxPetalRadius;
  if (isBLong || isBClicked) targetRadius = minPetalRadius;
  
  // 平滑过渡伸缩
  if (currentPetalRadius < targetRadius) currentPetalRadius = Math.min(currentPetalRadius + 3 * dt, targetRadius);
  if (currentPetalRadius > targetRadius) currentPetalRadius = Math.max(currentPetalRadius - 3 * dt, targetRadius);

  // 2. 物理引擎移动（加速、惯性）
  if (joy.act) {
    P.vx += joy.dx * P.accel * dt;
    P.vy += joy.dy * P.accel * dt;
    if (Math.hypot(P.vx, P.vy) > 0.1) P.face = Math.atan2(P.vy, P.vx);
  }
  
  // 摩擦力
  P.vx *= Math.pow(P.friction, dt);
  P.vy *= Math.pow(P.friction, dt);
  
  // 限制最大速度
  let spd = Math.hypot(P.vx, P.vy);
  if (spd > P.maxSpeed) {
    P.vx = (P.vx / spd) * P.maxSpeed;
    P.vy = (P.vy / spd) * P.maxSpeed;
  }
  
  // 移动并处理边界反弹（碰撞）
  P.x += P.vx * dt;
  P.y += P.vy * dt;
  if (P.x < P.r) { P.x = P.r; P.vx *= -0.5; }
  if (P.x > W - P.r) { P.x = W - P.r; P.vx *= -0.5; }
  if (P.y < P.r) { P.y = P.r; P.vy *= -0.5; }
  if (P.y > H - P.r) { P.y = H - P.r; P.vy *= -0.5; }

  // 3. 怪物和花瓣判定
  P.ang += .04 * dt;
  P.pts.forEach(p => { if (p.cd > 0) p.cd -= dt; });
  if (M.length < 8 && Math.random() < .02) spawn();

  for (let i = M.length - 1; i >= 0; i--) {
    let m = M[i];
    if (m.fl > 0) m.fl -= dt;
    if (m.acd > 0) m.acd -= dt;
    let dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy);
    if (d > 1) { m.x += dx / d * m.sp * dt; m.y += dy / d * m.sp * dt; }
    if (d < m.r + P.r && m.acd <= 0) { P.hp -= 8; P.fl = 8; m.acd = 40; }
    
    for (let p of P.pts) {
      if (p.cd > 0) continue;
      let a = P.ang + p.o;
      let px = P.x + Math.cos(a) * currentPetalRadius;
      let py = P.y + Math.sin(a) * currentPetalRadius;
      if (dst({ x: px, y: py }, m) < p.r + m.r) {
        m.hp -= 12; m.fl = 8; p.cd = 20; break;
      }
    }
    if (m.hp <= 0) { D.push({ x: m.x, y: m.y, r: 8, t: 0 }); M.splice(i, 1); }
  }

  for (let i = D.length - 1; i >= 0; i--) {
    let d = D[i]; d.t += dt;
    if (dst(d, P) < P.r + d.r) { P.n = Math.min(P.n + 1, 10); initP(P.n); D.splice(i, 1); }
  }
  
  if (P.hp <= 0) {
    P.hp = P.mhp; P.x = W / 2; P.y = H / 2; P.vx = 0; P.vy = 0;
    M.length = 0; P.n = 5; initP(5);
  }
  if (P.fl > 0) P.fl -= dt;
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

  // 掉落物
  D.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fillStyle = '#ffd93d'; ctx.fill(); });
  
  // 怪物
  M.forEach(m => { ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fillStyle = m.fl > 0 ? '#fff' : m.c; ctx.fill(); });

  // 花瓣
  P.pts.forEach(p => {
    if (p.cd > 0) return;
    let a = P.ang + p.o;
    ctx.beginPath();
    ctx.arc(P.x + Math.cos(a) * currentPetalRadius, P.y + Math.sin(a) * currentPetalRadius, p.r, 0, 7);
    ctx.fillStyle = '#ff6b9d';
    ctx.fill();
  });

  // 玩家本体（圆球，去掉了尖角）
  ctx.beginPath();
  ctx.arc(P.x, P.y, P.r, 0, 7);
  ctx.fillStyle = P.fl > 0 ? '#f44' : '#4dabf7';
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

  // 卫星指示箭头
  if (settings.showArrow && (Math.abs(P.vx) > 0.5 || Math.abs(P.vy) > 0.5)) {
    let angle = Math.atan2(P.vy, P.vx);
    let dist = P.r + 15; // 卫星距离
    let ax = P.x + Math.cos(angle) * dist;
    let ay = P.y + Math.sin(angle) * dist;
    
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-4, -6); ctx.lineTo(-4, 6); ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fill();
    ctx.restore();
  }

  // 绘制摇杆
  if (settings.showUI || joy.act) {
    if (settings.joyMode === 'fixed' && !joy.act) {
      drawJoy(FX, FY, FX, FY, 0, 0, false);
    } else if (joy.act) {
      drawJoy(joy.bx, joy.by, joy.kx, joy.ky, joy.dx, joy.dy, true);
    }
  }

  // 绘制左上角玩家信息
  if (settings.showUI) {
    let hx = 60, hy = 60;
    
    // 头像（纯圆球无尖角）
    ctx.beginPath();
    ctx.arc(hx, hy, 20, 0, 7);
    ctx.fillStyle = P.fl > 0 ? '#f44' : '#4dabf7';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

    // 血条底框
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(hx + 30, hy - 12, 120, 24);
    
    // 血条
    ctx.fillStyle = '#f44';
    ctx.fillRect(hx + 30, hy - 12, 120 * Math.max(0, P.hp / P.mhp), 24);
    
    // 血量数字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.round(P.hp)}/${P.mhp}`, hx + 40, hy + 1);
  }
}

function drawJoy(bx, by, kx, ky, dx, dy, active) {
  ctx.globalAlpha = active ? 1 : 0.3;
  // 底盘
  ctx.beginPath(); ctx.arc(bx, by, JR, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  
  // 摇杆头 (根据设置决定是否画)
  if (settings.joyLook === 'head') {
    ctx.beginPath(); ctx.arc(kx, ky, KR, 0, 7);
    ctx.fillStyle = 'rgba(77, 171, 247, 0.8)'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

requestAnimationFrame(loop);
</script>
</body>
</html>
