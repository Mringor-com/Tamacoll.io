<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>花瓣游戏</title>
<style>
* {
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  overflow: hidden;
  background: #1a1a2e;
  touch-action: none;
  user-select: none;
  font-family: sans-serif;
  color: #fff;
}
canvas { display: block; }
.ui-btn {
  position: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  z-index: 10;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.5);
  transition: transform .18s ease, opacity .18s ease;
  -webkit-tap-highlight-color: transparent;
}
.ui-btn:active { transform: scale(.95); }
#btnA { width: 70px; height: 70px; bottom: 120px; right: 30px; font-size: 28px; }
#btnB { width: 70px; height: 70px; bottom: 30px; right: 120px; font-size: 28px; }
#btnSettings {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 45px;
  height: 45px;
  border-radius: 12px;
  background: rgba(255,255,255,.2);
  border: 2px solid rgba(255,255,255,.5);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  z-index: 100;
  cursor: pointer;
  transition: transform .18s ease, opacity .18s ease;
  -webkit-tap-highlight-color: transparent;
}
#minimapContainer {
  position: fixed;
  top: 20px;
  right: 80px;
  width: 80px;
  height: 80px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,.6);
  overflow: hidden;
  z-index: 50;
  background: #000;
  transition: width .25s ease, height .25s ease, top .25s ease, right .25s ease, transform .18s ease, opacity .18s ease;
  -webkit-tap-highlight-color: transparent;
}
#minimapCanvas { width: 100%; height: 100%; display: block; }
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%) scale(.9);
  opacity: 0;
  pointer-events: none;
  background: rgba(20,25,40,.95);
  border: 2px solid #4dabf7;
  border-radius: 20px;
  padding: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.8);
  transition: transform .25s cubic-bezier(.175,.885,.32,1.275), opacity .25s, height .25s ease;
}
.panel.show {
  transform: translate(-50%,-50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}
.panel h2 { margin: 0 0 10px 0; text-align: center; color: #4dabf7; font-size: 20px; }
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  width: 100%;
  gap: 15px;
}
.setting-row button {
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #4dabf7;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  min-width: 80px;
  transition: .2s;
  -webkit-tap-highlight-color: transparent;
}
.setting-row button:active { transform: scale(.95); }
.setting-row input[type="range"] {
  flex: 1;
  margin: 0 10px;
  accent-color: #4dabf7;
}
.close-x {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  color: #ff6b9d;
  cursor: pointer;
  font-weight: bold;
}
#settingsPanel { width: 85%; max-width: 350px; }
#layoutPanel {
  top: 15px;
  left: 15px;
  transform: scale(.9);
  opacity: 0;
  pointer-events: none;
  padding: 15px;
  width: 240px;
  border-color: #ffd93d;
  border-radius: 15px;
  transition: transform .25s cubic-bezier(.175,.885,.32,1.275), opacity .25s, height .25s ease;
}
#layoutPanel.show {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}
#layoutPanel.collapsed .panel-content { display: none; }
#layoutPanel.collapsed h2 { margin: 0; font-size: 16px; }
#toggleCollapse {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  padding: 0;
  min-width: 30px;
}
#layoutPanel-header {
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  border-bottom: 1px solid rgba(255,255,255,.2);
  padding-bottom: 5px;
  margin-bottom: 10px;
}
.dragging {
  border: 2px dashed #ffd93d !important;
  box-shadow: 0 0 15px #ffd93d;
  z-index: 999;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btnA" class="ui-btn">A</div>
<div id="btnB" class="ui-btn">B</div>
<div id="btnSettings">⚙️</div>
<div id="minimapContainer"><canvas id="minimapCanvas"></canvas></div>
<div id="settingsPanel" class="panel">
  <span class="close-x" onclick="closeSettingsPanel()">×</span>
  <h2>游戏设置</h2>
  <div class="setting-row"><span>摇杆模式</span><button id="setJoyMode">动态</button></div>
  <div class="setting-row"><span>按键模式</span><button id="setKeyMode">长按</button></div>
  <div class="setting-row"><span>屏幕方向</span><button id="setScreen">自由</button></div>
  <div class="setting-row"><span>自定义键位</span><button id="enterLayoutMode" style="background:#ff6b9d;">进入调整</button></div>
</div>
<div id="layoutPanel" class="panel">
  <div id="layoutPanel-header">
    <h2>调整键位</h2>
    <button id="toggleCollapse">▼</button>
  </div>
  <div class="panel-content" id="layoutContent">
    <p style="font-size:12px;color:#aaa;margin:0 0 10px 0;">点击场景元素调专属设置：</p>
    <div id="dynamicSettings" style="display:flex;flex-direction:column;gap:10px;"></div>
    <button class="close-btn" id="exitLayoutMode" style="margin-top:10px;padding:10px;border-radius:10px;border:none;background:#ff6b9d;color:#fff;font-weight:bold;">保存并退出</button>
  </div>
</div>
<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const minimapContainer = document.getElementById('minimapContainer');
const minimapCanvas = document.getElementById('minimapCanvas');
const mmCtx = minimapCanvas.getContext('2d');

let W, H;
function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
  syncMinimapSize();
}
function syncMinimapSize() {
  const r = minimapContainer.getBoundingClientRect();
  minimapCanvas.width = Math.max(1, Math.floor(r.width));
  minimapCanvas.height = Math.max(1, Math.floor(r.height));
}
resize();
window.addEventListener('resize', resize);

const WORLD = 3000;
const MARGIN = 50;
const MAXR = WORLD - MARGIN;

let settings = {
  joyMode: 'dynamic',
  keyMode: 'hold',
  screen: 'free',
  isLayoutMode: false,
  showUI: true,
  arrowStyle: 1,
  joyCfg: { size: 1, alpha: 1, showHead: true },
  btnACfg: { size: 1, alpha: 1 },
  btnBCfg: { size: 1, alpha: 1 },
  hpCfg: { size: 1, alpha: 1, showNumber: true },
  monstCfg: { alpha: 1, showHpBar: true, showHpNum: true },
  gearCfg: { size: 1, alpha: 1 },
  mapCfg: { size: 1, alpha: 1 }
};

// 可拖拽的 UI 位置（自定义键位模式里拖，退出后保留）
const uiPos = {
  hp: { x: 60, y: 60 },
  joy: { x: 100, y: null }
};

const cur = { joySize: 1, joyAlpha: 1, hpSize: 1, hpAlpha: 1 };

const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const btnSettings = document.getElementById('btnSettings');
const settingsPanel = document.getElementById('settingsPanel');
const layoutPanel = document.getElementById('layoutPanel');
const dynamicSettings = document.getElementById('dynamicSettings');

// 面板高度过渡：每次内容变化时记录高度并动画
function animatePanelHeight() {
  const target = layoutPanel.querySelector('.panel-content').scrollHeight + 30;
  layoutPanel.style.height = target + 'px';
}

function openSettingsPanel() {
  settingsPanel.classList.add('show');
}
function closeSettingsPanel() {
  settingsPanel.classList.remove('show');
  applyScreenOrientation();
}

// 点设置面板外面关闭
window.addEventListener('touchstart', e => {
  if (!settingsPanel.classList.contains('show')) return;
  if (settingsPanel.contains(e.target)) return;
  if (e.target === btnSettings) return;
  closeSettingsPanel();
}, { passive: false });

btnSettings.onclick = () => {
  if (!settings.isLayoutMode) openSettingsPanel();
};

const btnSetJoy = document.getElementById('setJoyMode');
const btnSetKey = document.getElementById('setKeyMode');
const btnSetScreen = document.getElementById('setScreen');

function updateUIButtons() {
  btnSetJoy.innerText = settings.joyMode === 'dynamic' ? '动态' : '固定';
  btnSetKey.innerText = settings.keyMode === 'hold' ? '长按' : '点击';
  btnSetScreen.innerText = settings.screen === 'free' ? '自由' : (settings.screen === 'landscape' ? '横屏' : '竖屏');
}
btnSetJoy.onclick = () => {
  settings.joyMode = settings.joyMode === 'dynamic' ? 'fixed' : 'dynamic';
  updateUIButtons();
  resetJoy();
};
btnSetKey.onclick = () => {
  settings.keyMode = settings.keyMode === 'hold' ? 'click' : 'hold';
  updateUIButtons();
};
btnSetScreen.onclick = () => {
  settings.screen = settings.screen === 'free' ? 'landscape' : (settings.screen === 'landscape' ? 'portrait' : 'free');
  updateUIButtons();
};
updateUIButtons();

function applyScreenOrientation() {
  if (settings.screen === 'landscape') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } else if (settings.screen === 'portrait') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
  } else {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
}

document.getElementById('enterLayoutMode').onclick = () => {
  closeSettingsPanel();
  layoutPanel.classList.add('show');
  settings.isLayoutMode = true;
  dynamicSettings.innerHTML = '<p style="font-size:12px;color:#aaa;">点击场景元素进行专属调整</p>';
  animatePanelHeight();
};
document.getElementById('exitLayoutMode').onclick = () => {
  layoutPanel.classList.remove('show');
  settings.isLayoutMode = false;
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  updateUIVisuals();
};
document.getElementById('toggleCollapse').onclick = () => {
  layoutPanel.classList.toggle('collapsed');
  document.getElementById('toggleCollapse').innerText = layoutPanel.classList.contains('collapsed') ? '▲' : '▼';
  animatePanelHeight();
};

let isDraggingPanel = false, panelStartX, panelStartY, panelInitX, panelInitY;
document.getElementById('layoutPanel-header').addEventListener('touchstart', e => {
  isDraggingPanel = true;
  let t = e.touches[0];
  panelStartX = t.clientX;
  panelStartY = t.clientY;
  let rect = layoutPanel.getBoundingClientRect();
  panelInitX = rect.left;
  panelInitY = rect.top;
  layoutPanel.style.transform = 'none';
  layoutPanel.style.left = panelInitX + 'px';
  layoutPanel.style.top = panelInitY + 'px';
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (isDraggingPanel) {
    let t = e.touches[0];
    layoutPanel.style.left = (panelInitX + t.clientX - panelStartX) + 'px';
    layoutPanel.style.top = (panelInitY + t.clientY - panelStartY) + 'px';
  }
}, { passive: false });
window.addEventListener('touchend', () => isDraggingPanel = false);

function buildSlider(label, val, min, max, cb) {
  let div = document.createElement('div');
  div.className = 'setting-row';
  div.innerHTML = `<span>${label}: <span>${Math.round(val*100)}%</span></span>`;
  let input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = .05;
  input.value = val;
  input.oninput = (e) => {
    let v = parseFloat(e.target.value);
    div.querySelector('span span').innerText = Math.round(v*100) + '%';
    cb(v);
  };
  div.appendChild(input);
  return div;
}

function updateUIVisuals() {
  btnA.style.transform = `scale(${settings.btnACfg.size})`;
  btnA.style.opacity = settings.btnACfg.alpha;
  btnB.style.transform = `scale(${settings.btnBCfg.size})`;
  btnB.style.opacity = settings.btnBCfg.alpha;
  btnSettings.style.transform = `scale(${settings.gearCfg.size})`;
  btnSettings.style.opacity = settings.gearCfg.alpha;
  minimapContainer.style.opacity = settings.mapCfg.alpha;
  syncMinimapSize();
}

function selectUIElement(target) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  dynamicSettings.innerHTML = '';
  if (target === 'joy') {
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">摇杆设置</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.joyCfg.size, .5, 1.5, v => settings.joyCfg.size = v));
    dynamicSettings.appendChild(buildSlider('透明度', settings.joyCfg.alpha, .1, 1, v => settings.joyCfg.alpha = v));
    let btn = document.createElement('button');
    btn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
    btn.onclick = () => {
      settings.joyCfg.showHead = !settings.joyCfg.showHead;
      btn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
    };
    dynamicSettings.appendChild(btn);
    let hint = document.createElement('p');
    hint.style.cssText = 'font-size:12px;color:#aaa;margin:0;';
    hint.innerText = '在场景里按住摇杆可拖动位置';
    dynamicSettings.appendChild(hint);
  } else if (target === 'hpbar' || target === 'player') {
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">左上角血条 / 玩家</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.hpCfg.size, .5, 1.5, v => settings.hpCfg.size = v));
    dynamicSettings.appendChild(buildSlider('透明度', settings.hpCfg.alpha, .1, 1, v => settings.hpCfg.alpha = v));
    let btn = document.createElement('button');
    btn.innerText = '血量数值: ' + (settings.hpCfg.showNumber ? '显示' : '隐藏');
    btn.onclick = () => {
      settings.hpCfg.showNumber = !settings.hpCfg.showNumber;
      btn.innerText = '血量数值: ' + (settings.hpCfg.showNumber ? '显示' : '隐藏');
    };
    dynamicSettings.appendChild(btn);
    let btn2 = document.createElement('button');
    btn2.innerText = '切换箭头样式 (当前:' + settings.arrowStyle + ')';
    btn2.onclick = () => {
      settings.arrowStyle = settings.arrowStyle % 4 + 1;
      btn2.innerText = '切换箭头样式 (当前:' + settings.arrowStyle + ')';
    };
    dynamicSettings.appendChild(btn2);
    let hint = document.createElement('p');
    hint.style.cssText = 'font-size:12px;color:#aaa;margin:0;';
    hint.innerText = '在场景里按住头像/血条可拖动位置';
    dynamicSettings.appendChild(hint);
  } else if (target === 'fakeMonster') {
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">假怪血条设置</h3>';
    dynamicSettings.appendChild(buildSlider('透明度', settings.monstCfg.alpha, .1, 1, v => settings.monstCfg.alpha = v));
    let btn1 = document.createElement('button');
    btn1.innerText = '显示血条: ' + (settings.monstCfg.showHpBar ? '开' : '关');
    btn1.onclick = () => {
      settings.monstCfg.showHpBar = !settings.monstCfg.showHpBar;
      btn1.innerText = '显示血条: ' + (settings.monstCfg.showHpBar ? '开' : '关');
    };
    let btn2 = document.createElement('button');
    btn2.innerText = '显示数值: ' + (settings.monstCfg.showHpNum ? '开' : '关');
    btn2.onclick = () => {
      settings.monstCfg.showHpNum = !settings.monstCfg.showHpNum;
      btn2.innerText = '显示数值: ' + (settings.monstCfg.showHpNum ? '开' : '关');
    };
    dynamicSettings.appendChild(btn1);
    dynamicSettings.appendChild(btn2);
  } else if (target === 'btnA') {
    btnA.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">A 键</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.btnACfg.size, .5, 1.5, v => { settings.btnACfg.size = v; updateUIVisuals(); }));
    dynamicSettings.appendChild(buildSlider('透明度', settings.btnACfg.alpha, .1, 1, v => { settings.btnACfg.alpha = v; updateUIVisuals(); }));
  } else if (target === 'btnB') {
    btnB.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">B 键</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.btnBCfg.size, .5, 1.5, v => { settings.btnBCfg.size = v; updateUIVisuals(); }));
    dynamicSettings.appendChild(buildSlider('透明度', settings.btnBCfg.alpha, .1, 1, v => { settings.btnBCfg.alpha = v; updateUIVisuals(); }));
  } else if (target === 'gear') {
    btnSettings.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">设置齿轮</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.gearCfg.size, .5, 1.5, v => { settings.gearCfg.size = v; updateUIVisuals(); }));
    dynamicSettings.appendChild(buildSlider('透明度', settings.gearCfg.alpha, .1, 1, v => { settings.gearCfg.alpha = v; updateUIVisuals(); }));
  } else if (target === 'map') {
    minimapContainer.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">小地图设置</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.mapCfg.size, .5, 2, v => { settings.mapCfg.size = v; updateUIVisuals(); }));
    dynamicSettings.appendChild(buildSlider('透明度', settings.mapCfg.alpha, .1, 1, v => { settings.mapCfg.alpha = v; updateUIVisuals(); }));
  }
  animatePanelHeight();
}

function initDrag(el, type) {
  el.addEventListener('touchstart', e => {
    if (!settings.isLayoutMode) return;
    e.preventDefault();
    e.stopPropagation();
    let t = e.touches[0];
    let startX = t.clientX, startY = t.clientY;
    let rect = el.getBoundingClientRect();
    selectUIElement(type);
    function onMove(me) {
      let mt = me.touches[0];
      el.style.left = (rect.left + mt.clientX - startX) + 'px';
      el.style.top = (rect.top + mt.clientY - startY) + 'px';
      el.style.bottom = 'auto';
      el.style.right = 'auto';
    }
    function onEnd() {
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);
    }
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
  }, { passive: false });
}
initDrag(btnA, 'btnA');
initDrag(btnB, 'btnB');
initDrag(btnSettings, 'gear');
initDrag(minimapContainer, 'map');

const P = {
  x: WORLD / 2, y: WORLD / 2, r: 16,
  vx: 0, vy: 0, accel: .45, friction: .86, maxSpeed: 4,
  hp: 100, mhp: 100, displayHp: 100,
  pts: [], n: 5, ang: 0, fl: 0,
  arrowAlpha: 0, stillTimer: 0, arrowAngle: 0,
  wasMoving: false
};
function initP(n) {
  P.pts = [];
  for (let i = 0; i < n; i++) P.pts.push({ o: i * (Math.PI * 2 / n), cd: 0, r: 10, appear: 1 });
}
initP(P.n);

const M = [], D = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const dst = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const cam = { x: P.x - W / 2, y: P.y - H / 2 };

function spawn() {
  let x = rnd(MARGIN + 50, MAXR - 50);
  let y = rnd(MARGIN + 50, MAXR - 50);
  let aiType = Math.floor(rnd(0, 4));
  let baseSpeed = rnd(1, 1.8);
  let chaseSpeed = Math.min(rnd(1.5, 2.5), P.maxSpeed);
  M.push({
    x, y, r: rnd(14, 22), hp: 40, mhp: 40,
    sp: baseSpeed, chSp: chaseSpeed,
    c: `hsl(${rnd(0, 360)},70%,55%)`,
    fl: 0, acd: 0, ai: aiType, state: 0,
    wanderAngle: rnd(0, 6.28)
  });
}

let joy = { act: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, id: null, visAlpha: 0 };
let JR = 60, KR = 30;
let FX = 100, FY = H - 120;

function resetJoy() {
  joy.act = false;
  joy.dx = 0;
  joy.dy = 0;
  joy.id = null;
}

cvs.addEventListener('touchstart', e => {
  if (!settings.showUI || settings.isLayoutMode) return;
  if (settingsPanel.classList.contains('show')) return;
  const t = e.changedTouches[0], tx = t.clientX, ty = t.clientY;
  if (joy.act) return;
  if (settings.joyMode === 'fixed') {
    joy.bx = uiPos.joy.x;
    joy.by = uiPos.joy.y !== null ? uiPos.joy.y : FY;
    joy.kx = joy.bx;
    joy.ky = joy.by;
  } else {
    joy.bx = tx; joy.by = ty;
    joy.kx = tx; joy.ky = ty;
  }
  joy.act = true;
  joy.id = t.identifier;
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joy.act || settings.isLayoutMode) return;
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.bx, dy = t.clientY - joy.by;
      const dist = Math.hypot(dx, dy);
      if (dist > JR) {
        dx = dx / dist * JR;
        dy = dy / dist * JR;
      }
      joy.kx = joy.bx + dx;
      joy.ky = joy.by + dy;
      joy.dx = dx / JR;
      joy.dy = dy / JR;
    }
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++)
    if (e.changedTouches[i].identifier === joy.id) resetJoy();
});

let currentPetalRadius = 46;
const maxPetalRadius = 90, minPetalRadius = 25;
let isALong = false, isBLong = false, isAClicked = false, isBClicked = false;

function handleDown(isA) {
  if (!settings.showUI || settings.isLayoutMode) return;
  if (settingsPanel.classList.contains('show')) return;
  if (settings.keyMode === 'hold') {
    if (isA) isALong = true; else isBLong = true;
  } else {
    if (isA) {
      isAClicked = !isAClicked;
      if (isAClicked) isBClicked = false;
    } else {
      isBClicked = !isBClicked;
      if (isBClicked) isAClicked = false;
    }
  }
}
btnA.addEventListener('touchstart', e => { e.preventDefault(); handleDown(true); });
btnA.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isALong = false; });
btnB.addEventListener('touchstart', e => { e.preventDefault(); handleDown(false); });
btnB.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isBLong = false; });

cvs.addEventListener('dblclick', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
});

let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 16.67, 2);
  last = now;
  if (!settings.isLayoutMode) upd(dt);
  cur.joySize += (settings.joyCfg.size - cur.joySize) * .2 * dt;
  cur.joyAlpha += (settings.joyCfg.alpha - cur.joyAlpha) * .2 * dt;
  cur.hpSize += (settings.hpCfg.size - cur.hpSize) * .2 * dt;
  cur.hpAlpha += (settings.hpCfg.alpha - cur.hpAlpha) * .2 * dt;
  // 摇杆整体淡入淡出
  let joyTarget = joy.act ? 1 : 0;
  joy.visAlpha += (joyTarget - joy.visAlpha) * .15 * dt;
  draw();
  requestAnimationFrame(loop);
}

function clampBound(o, isPlayer) {
  let hit = false;
  if (o.x < MARGIN + o.r) {
    o.x = MARGIN + o.r;
    if (isPlayer) o.vx = 0;
    hit = true;
  } else if (o.x > MAXR - o.r) {
    o.x = MAXR - o.r;
    if (isPlayer) o.vx = 0;
    hit = true;
  }
  if (o.y < MARGIN + o.r) {
    o.y = MARGIN + o.r;
    if (isPlayer) o.vy = 0;
    hit = true;
  } else if (o.y > MAXR - o.r) {
    o.y = MAXR - o.r;
    if (isPlayer) o.vy = 0;
    hit = true;
  }
  return hit;
}

function upd(dt) {
  let targetRadius = 46;
  if (isALong || isAClicked) targetRadius = maxPetalRadius;
  if (isBLong || isBClicked) targetRadius = minPetalRadius;
  // 伸缩带回弹缓动
  let speed = 6;
  if (currentPetalRadius < targetRadius) currentPetalRadius = Math.min(currentPetalRadius + speed * dt, targetRadius);
  if (currentPetalRadius > targetRadius) currentPetalRadius = Math.max(currentPetalRadius - speed * dt, targetRadius);

  if (joy.act) {
    P.vx += joy.dx * P.accel * dt;
    P.vy += joy.dy * P.accel * dt;
  }
  P.vx *= Math.pow(P.friction, dt);
  P.vy *= Math.pow(P.friction, dt);
  let spd = Math.hypot(P.vx, P.vy);
  if (spd > P.maxSpeed) {
    P.vx = P.vx / spd * P.maxSpeed;
    P.vy = P.vy / spd * P.maxSpeed;
  }
  P.x += P.vx * dt;
  P.y += P.vy * dt;
  clampBound(P, true);

  if (P.displayHp > P.hp) P.displayHp -= 0.15 * dt;
  if (P.displayHp < P.hp) P.displayHp = P.hp;

  // 花瓣旋转加轻微起伏，更自然
  P.ang += (.04 + Math.sin(performance.now() / 900) * 0.012) * dt;
  P.pts.forEach(p => {
    if (p.cd > 0) {
      p.cd -= dt;
      p.appear = Math.max(0, p.appear - 0.08 * dt);
    } else {
      p.appear = Math.min(1, p.appear + 0.06 * dt);
    }
  });

  if (M.length < 15 && Math.random() < .05) spawn();

  for (let i = M.length - 1; i >= 0; i--) {
    let m = M[i];
    if (m.fl > 0) m.fl -= dt;
    if (m.acd > 0) m.acd -= dt;
    let dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy);
    if (m.ai === 2 && d < 250) m.state = 1;
    if (m.state === 1) {
      if (d > 1) {
        m.x += dx / d * m.chSp * dt;
        m.y += dy / d * m.chSp * dt;
      }
    } else if (m.ai === 1 || m.ai === 2 || m.ai === 3) {
      m.wanderAngle += rnd(-0.1, 0.1);
      m.x += Math.cos(m.wanderAngle) * m.sp * dt;
      m.y += Math.sin(m.wanderAngle) * m.sp * dt;
    }
    if (clampBound(m, false)) {
      m.wanderAngle += Math.PI * (0.6 + Math.random() * 0.8);
    }
    if (d < m.r + P.r) {
      let angle = Math.atan2(P.y - m.y, P.x - m.x);
      let overlap = (m.r + P.r) - d;
      P.x += Math.cos(angle) * overlap * 0.5;
      P.y += Math.sin(angle) * overlap * 0.5;
      m.x -= Math.cos(angle) * overlap * 0.5;
      m.y -= Math.sin(angle) * overlap * 0.5;
      P.vx += Math.cos(angle) * 2;
      P.vy += Math.sin(angle) * 2;
      if (m.acd <= 0) {
        P.hp -= 8;
        P.fl = 8;
        m.acd = 7;
      }
    }
    for (let p of P.pts) {
      if (p.cd > 0) continue;
      let a = P.ang + p.o;
      let px = P.x + Math.cos(a) * currentPetalRadius;
      let py = P.y + Math.sin(a) * currentPetalRadius;
      if (dst({ x: px, y: py }, m) < p.r + m.r) {
        m.hp -= 12;
        m.fl = 8;
        p.cd = 20;
        p.appear = 1;
        if (m.ai === 3) m.state = 1;
        break;
      }
    }
    if (m.hp <= 0) {
      D.push({ x: m.x, y: m.y, r: 10, t: 30 });
      M.splice(i, 1);
    }
  }

  for (let i = D.length - 1; i >= 0; i--) {
    let d = D[i];
    d.t -= dt / 60;
    if (dst(d, P) < P.r + d.r) {
      P.n = Math.min(P.n + 1, 10);
      initP(P.n);
      D.splice(i, 1);
    } else if (d.t <= 0) {
      D.splice(i, 1);
    }
  }

  if (P.hp <= 0) {
    P.hp = P.mhp;
    P.displayHp = P.mhp;
    P.x = WORLD / 2;
    P.y = WORLD / 2;
    P.vx = 0;
    P.vy = 0;
    M.length = 0;
    P.n = 5;
    initP(5);
  }
  if (P.fl > 0) P.fl -= dt;

  // 箭头逻辑：移动就亮，静止满50s才慢慢灭，中间不闪
  const movingNow = joy.act || Math.hypot(P.vx, P.vy) > 0.2;
  if (movingNow) {
    P.stillTimer = 0;
    P.arrowAlpha = Math.min(1, P.arrowAlpha + 0.08 * dt);
    if (joy.act && (Math.abs(joy.dx) > 0.05 || Math.abs(joy.dy) > 0.05)) {
      P.arrowAngle = Math.atan2(joy.dy, joy.dx);
    }
  } else {
    P.stillTimer += dt / 60;
    if (P.stillTimer >= 50) {
      P.arrowAlpha = Math.max(0, P.arrowAlpha - 0.02 * dt);
    }
  }
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (settings.isLayoutMode) {
    drawGridScreen();
    // 玩家
    drawPlayer(uiPos.hp.x + 40, uiPos.hp.y + 40, true);
    // 假怪
    let fx = W / 2 + 100, fy = H / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, 20, 0, 7);
    ctx.fillStyle = '#888';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = settings.monstCfg.alpha;
    if (settings.monstCfg.showHpBar) {
      let w = 30, barY = fy + 20 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(fx - w / 2, barY, w, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#f44';
      ctx.beginPath();
      ctx.roundRect(fx - w / 2, barY, w * 0.5, 4, 2);
      ctx.fill();
      if (settings.monstCfg.showHpNum) {
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('20/40', fx, barY - 4);
      }
    }
    ctx.globalAlpha = 1;
    drawJoy(uiPos.joy.x, uiPos.joy.y !== null ? uiPos.joy.y : FY, uiPos.joy.x, uiPos.joy.y !== null ? uiPos.joy.y : FY, 0, 0, 1);
    drawPlayerHUD();
    drawMinimap();
    return;
  }

  cam.x = P.x - W / 2;
  cam.y = P.y - H / 2;

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  drawGridWorld();

  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(MARGIN, MARGIN, WORLD - MARGIN * 2, WORLD - MARGIN * 2, 30);
  ctx.stroke();

  D.forEach(d => {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, 7);
    ctx.fillStyle = '#ffd93d';
    ctx.fill();
  });

  M.forEach(m => {
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, 7);
    ctx.fillStyle = m.fl > 0 ? '#fff' : m.c;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (m.hp < m.mhp) {
      let w = m.r * 1.5, barY = m.y + m.r + 4;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(m.x - w / 2, barY, w, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#f44';
      ctx.beginPath();
      ctx.roundRect(m.x - w / 2, barY, w * (m.hp / m.mhp), 4, 2);
      ctx.fill();
    }
  });

  // 花瓣：冷却时淡出；且只在角色圈外才露出来
  ctx.save();
  P.pts.forEach(p => {
    if (p.appear <= 0.01) return;
    let a = P.ang + p.o;
    let px = P.x + Math.cos(a) * currentPetalRadius;
    let py = P.y + Math.sin(a) * currentPetalRadius;
    // 花瓣圆离角色圆心距离 - 花瓣半径 < 角色半径，则完全被角色挡住
    let dToCenter = Math.hypot(px - P.x, py - P.y);
    if (dToCenter - p.r < P.r) return;
    ctx.globalAlpha = p.appear;
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, 7);
    ctx.fillStyle = '#ff6b9d';
    ctx.fill();
    ctx.strokeStyle = '#c94f7c';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  drawPlayer(P.x, P.y);

  ctx.restore();

  if (settings.showUI) {
    drawJoy(joy.bx, joy.by, joy.kx, joy.ky, joy.dx, joy.dy, joy.visAlpha);
    drawPlayerHUD();
    drawMinimap();
  }
}

function drawGridWorld() {
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  let startX = Math.floor(cam.x / 40) * 40;
  let startY = Math.floor(cam.y / 40) * 40;
  for (let x = startX; x < cam.x + W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, cam.y);
    ctx.lineTo(x, cam.y + H);
    ctx.stroke();
  }
  for (let y = startY; y < cam.y + H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(cam.x, y);
    ctx.lineTo(cam.x + W, y);
    ctx.stroke();
  }
}

function drawGridScreen() {
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, H);
    ctx.stroke();
  }
  for (let i = 0; i < H; i += 40) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(W, i);
    ctx.stroke();
  }
}

function drawPlayer(x, y, layoutPreview) {
  ctx.beginPath();
  ctx.arc(x, y, P.r, 0, 7);
  ctx.fillStyle = P.fl > 0 ? '#f44' : '#4dabf7';
  ctx.fill();
  ctx.strokeStyle = '#1c5a8a';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (layoutPreview) return;

  if (P.arrowAlpha > 0.01) {
    let angle = settings.isLayoutMode ? -Math.PI / 2 : P.arrowAngle;
    if (!settings.isLayoutMode && P.arrowAlpha > 0 && P.stillTimer === 0 && Math.hypot(P.vx, P.vy) <= 0.2) {
      angle = P.arrowAngle;
    }
    let dist = P.r + 15;
    ctx.save();
    ctx.globalAlpha = P.arrowAlpha;
    ctx.translate(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist);
    ctx.rotate(angle);
    ctx.fillStyle = '#fff';
    if (settings.arrowStyle === 1) {
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-4, -6);
      ctx.lineTo(-4, 6);
      ctx.closePath();
      ctx.fill();
    } else if (settings.arrowStyle === 2) {
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.arcTo(-4, -6, -4, 6, 3);
      ctx.arcTo(-4, 6, 8, 0, 3);
      ctx.arcTo(8, 0, -4, -6, 3);
      ctx.fill();
    } else if (settings.arrowStyle === 3) {
      ctx.beginPath();
      ctx.arc(0, 0, 8, -Math.PI / 2, Math.PI / 2);
      ctx.arc(-4, 0, 6, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();
      ctx.fill();
    } else if (settings.arrowStyle === 4) {
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.quadraticCurveTo(-5, 10, -2, 0);
      ctx.quadraticCurveTo(-5, -10, 10, 0);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayerHUD() {
  let scale = cur.hpSize;
  let hx = uiPos.hp.x * scale, hy = uiPos.hp.y * scale;
  let hr = 20 * scale;
  let barW = 120 * scale, barH = 24 * scale;
  ctx.globalAlpha = cur.hpAlpha;
  ctx.beginPath();
  ctx.arc(hx, hy, hr, 0, 7);
  ctx.fillStyle = '#4dabf7';
  ctx.fill();
  ctx.strokeStyle = '#1c5a8a';
  ctx.lineWidth = 3 * scale;
  ctx.stroke();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  roundRect(hx + 30 * scale, hy - barH / 2, barW, barH, 10 * scale);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  if (P.displayHp > 0) {
    roundRect(hx + 30 * scale, hy - barH / 2, barW * (P.displayHp / P.mhp), barH, 10 * scale);
    ctx.fillStyle = '#8b0000';
    ctx.fill();
  }
  if (P.hp > 0) {
    roundRect(hx + 30 * scale, hy - barH / 2, barW * (P.hp / P.mhp), barH, 10 * scale);
    ctx.fillStyle = '#ff4444';
    ctx.fill();
  }
  if (settings.hpCfg.showNumber) {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${14 * scale}px monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.round(P.hp)}/${P.mhp}`, hx + 45 * scale, hy + 1);
  }
  ctx.globalAlpha = 1;
}

// 小地图三档缩放
let mapZoom = 0;
const mapSizes = [
  { w: 80, h: 80, top: 20, right: 80 },
  { w: 140, h: 140, top: 20, right: 60 },
  { w: 260, h: 260, top: '50%', right: '50%' }
];
function applyMapZoom() {
  const s = mapSizes[mapZoom];
  if (mapZoom === 2) {
    minimapContainer.style.width = s.w + 'px';
    minimapContainer.style.height = s.h + 'px';
    minimapContainer.style.top = '50%';
    minimapContainer.style.left = '50%';
    minimapContainer.style.right = 'auto';
    minimapContainer.style.transform = 'translate(-50%,-50%) scale(1)';
  } else {
    minimapContainer.style.width = s.w * settings.mapCfg.size + 'px';
    minimapContainer.style.height = s.h * settings.mapCfg.size + 'px';
    minimapContainer.style.top = s.top + 'px';
    minimapContainer.style.right = s.right + 'px';
    minimapContainer.style.left = 'auto';
    minimapContainer.style.transform = 'scale(1)';
  }
  setTimeout(syncMinimapSize, 280);
}
minimapContainer.addEventListener('click', () => {
  if (settings.isLayoutMode) return;
  mapZoom = (mapZoom + 1) % 3;
  applyMapZoom();
});

function drawMinimap() {
  const w = minimapCanvas.width, h = minimapCanvas.height;
  if (w < 2 || h < 2) return;
  const sx = w / WORLD, sy = h / WORLD;
  mmCtx.clearRect(0, 0, w, h);
  mmCtx.fillStyle = 'rgba(0,0,0,0.5)';
  mmCtx.fillRect(0, 0, w, h);

  // 点固定大小，不随地图变大变小
  const dotR = 2;
  mmCtx.fillStyle = '#f44';
  M.forEach(m => {
    mmCtx.beginPath();
    mmCtx.arc(m.x * sx, m.y * sy, dotR, 0, 7);
    mmCtx.fill();
  });
  mmCtx.fillStyle = '#4dabf7';
  mmCtx.beginPath();
  mmCtx.arc(P.x * sx, P.y * sy, dotR, 0, 7);
  mmCtx.fill();
}

function drawJoy(bx, by, kx, ky, dx, dy, alpha) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha * cur.joyAlpha;
  let size = cur.joySize;
  let jr = JR * size, kr = KR * size;
  ctx.beginPath();
  ctx.arc(bx, by, jr, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (settings.joyCfg.showHead) {
    ctx.beginPath();
    ctx.arc(kx, ky, kr, 0, 7);
    ctx.fillStyle = 'rgba(77,171,247,0.8)';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// 自定义键位命中：左上角血条可拖、摇杆可拖、假怪/玩家/A/B/齿轮/地图
let draggingUI = null, dragUIStartX, dragUIStartY, dragUIInitX, dragUIInitY;
cvs.addEventListener('touchstart', e => {
  if (!settings.isLayoutMode) return;
  const t = e.changedTouches[0];
  const tx = t.clientX, ty = t.clientY;

  let hs = cur.hpSize;
  let hx = uiPos.hp.x * hs, hy = uiPos.hp.y * hs, hr = 20 * hs;
  let barW = 120 * hs, barH = 24 * hs;
  let barX = hx + 30 * hs;
  if (
    Math.hypot(tx - hx, ty - hy) < hr + 20 ||
    (tx >= barX && tx <= barX + barW && ty >= hy - barH / 2 && ty <= hy + barH / 2)
  ) {
    selectUIElement('hpbar');
    draggingUI = 'hp';
    dragUIStartX = tx;
    dragUIStartY = ty;
    dragUIInitX = uiPos.hp.x;
    dragUIInitY = uiPos.hp.y;
    e.preventDefault();
    return;
  }

  // 摇杆
  let jr = JR * cur.joySize;
  let jx = uiPos.joy.x;
  let jy = uiPos.joy.y !== null ? uiPos.joy.y : FY;
  if (Math.hypot(tx - jx, ty - jy) < jr + 20) {
    selectUIElement('joy');
    draggingUI = 'joy';
    dragUIStartX = tx;
    dragUIStartY = ty;
    dragUIInitX = jx;
    dragUIInitY = jy;
    e.preventDefault();
    return;
  }

  // 玩家
  if (Math.hypot(tx - (uiPos.hp.x + 40), ty - (uiPos.hp.y + 40)) < P.r + 20) {
    selectUIElement('player');
    return;
  }

  // 假怪
  let fx = W / 2 + 100, fy = H / 2;
  let fw = 30, fbarY = fy + 20 + 6;
  if (
    Math.hypot(tx - fx, ty - fy) < 20 + 20 ||
    (tx >= fx - fw / 2 && tx <= fx + fw / 2 && ty >= fbarY && ty <= fbarY + 4)
  ) {
    selectUIElement('fakeMonster');
    return;
  }
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  if (!draggingUI) return;
  const t = e.changedTouches[0];
  const tx = t.clientX, ty = t.clientY;
  let nx = dragUIInitX + (tx - dragUIStartX);
  let ny = dragUIInitY + (ty - dragUIStartY);
  if (draggingUI === 'hp') {
    uiPos.hp.x = nx;
    uiPos.hp.y = ny;
  } else if (draggingUI === 'joy') {
    uiPos.joy.x = nx;
    uiPos.joy.y = ny;
  }
  e.preventDefault();
}, { passive: false });

cvs.addEventListener('touchend', () => {
  draggingUI = null;
});

requestAnimationFrame(loop);
</script>
