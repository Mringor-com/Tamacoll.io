<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>花瓣游戏 - 终极神作版</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; touch-action: none; user-select: none; font-family: sans-serif; color: #fff; }
  canvas { display: block; }
  
  /* UI 基础样式 */
  .ui-btn { position: fixed; display: flex; justify-content: center; align-items: center; font-weight: bold; z-index: 10; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); transition: transform 0.1s, background 0.1s; }
  .ui-btn:active { transform: scale(0.95); }
  
  /* 按键默认位置 */
  #btnA { width: 70px; height: 70px; bottom: 120px; right: 30px; font-size: 28px; }
  #btnB { width: 70px; height: 70px; bottom: 30px; right: 120px; font-size: 28px; }
  
  /* 设置齿轮 */
  #btnSettings { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; border-radius: 10px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 100; cursor: pointer; }
  
  /* 面板通用样式 */
  .panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 25, 40, 0.95); border: 2px solid #4dabf7; border-radius: 15px; padding: 20px; z-index: 200; display: none; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .panel h2 { margin: 0 0 10px 0; text-align: center; color: #4dabf7; font-size: 20px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; width: 100%; gap: 15px; }
  .setting-row button { padding: 6px 12px; border-radius: 5px; border: none; background: #4dabf7; color: #fff; font-weight: bold; cursor: pointer; min-width: 80px; }
  .setting-row input[type="range"] { flex: 1; margin: 0 10px; }
  .close-btn { margin-top: 15px; padding: 10px; border-radius: 8px; border: none; background: #ff6b9d; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
  
  /* 主设置面板 */
  #settingsPanel { width: 85%; max-width: 350px; }
  
  /* 键位调整模式专用面板 (可折叠) */
  #layoutPanel { top: 10px; left: 10px; transform: none; padding: 15px; width: 220px; }
  #layoutPanel.collapsed .panel-content { display: none; }
  #layoutPanel.collapsed h2 { margin: 0; font-size: 16px; }
  #toggleCollapse { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 0; min-width: 30px; }
  
  /* UI自定义元素的高级操作提示 */
  #layoutHint { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; font-size: 14px; color: #ffd93d; display: none; z-index: 150; border: 1px solid #ffd93d; }
  .hidden { display: none !important; }
  
  /* 拖动模式特效 */
  .dragging { border: 2px dashed #ffd93d !important; box-shadow: 0 0 15px #ffd93d; z-index: 999; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- 右下角技能键 -->
<div id="btnA" class="ui-btn">A</div>
<div id="btnB" class="ui-btn">B</div>

<!-- 右上角设置按钮 -->
<div id="btnSettings">⚙️</div>

<!-- 布局提示 -->
<div id="layoutHint">点击元素调整 | 拖拽移动位置</div>

<!-- 主设置面板 -->
<div id="settingsPanel" class="panel">
  <h2>游戏设置</h2>
  <div class="setting-row">
    <span>摇杆模式</span>
    <button id="setJoyMode">动态</button>
  </div>
  <div class="setting-row">
    <span>按键模式</span>
    <button id="setKeyMode">长按</button>
  </div>
  <div class="setting-row">
    <span>屏幕方向</span>
    <button id="setScreen">自由</button>
  </div>
  <div class="setting-row">
    <span>隐藏按键/UI</span>
    <button id="setUI">显示</button>
  </div>
  <div class="setting-row">
    <span>自定义键位</span>
    <button id="enterLayoutMode" style="background:#ff6b9d;">进入调整</button>
  </div>
  <button class="close-btn" id="closeSettings">完成并保存</button>
</div>

<!-- 键位调整面板 -->
<div id="layoutPanel" class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
    <h2>调整键位</h2>
    <button id="toggleCollapse">▼</button>
  </div>
  <div class="panel-content" id="layoutContent">
    <p style="font-size:12px; color:#aaa; margin:0 0 10px 0;">点击要调整的元素以展开专属选项：</p>
    <!-- 这里的内容会根据点击动态注入 -->
    <div id="dynamicSettings" style="display:flex; flex-direction:column; gap:10px;"></div>
    <button class="close-btn" id="exitLayoutMode">保存并退出</button>
  </div>
</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H;
function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ================= 全局状态 =================
let settings = {
  joyMode: 'dynamic',
  keyMode: 'hold',
  screen: 'free',
  showUI: true,
  isLayoutMode: false,
  // UI 元素的配置
  joyCfg: { size: 1, alpha: 1, showHead: true },
  btnACfg: { size: 1, alpha: 1 },
  btnBCfg: { size: 1, alpha: 1 },
  arrowCfg: { show: true }
};

// 地图与相机
const WORLD_W = 2000, WORLD_H = 2000;
let cam = { x: 0, y: 0 };
const MAP_MARGIN = 50; // 视觉边界粗细

// UI 元素
const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const settingsPanel = document.getElementById('settingsPanel');
const layoutPanel = document.getElementById('layoutPanel');
const layoutHint = document.getElementById('layoutHint');
const dynamicSettings = document.getElementById('dynamicSettings');

// ================= 面板交互 =================
document.getElementById('btnSettings').onclick = () => settingsPanel.style.display = 'flex';
document.getElementById('closeSettings').onclick = () => {
  settingsPanel.style.display = 'none';
  applyScreenOrientation();
};

const btnSetJoy = document.getElementById('setJoyMode');
const btnSetKey = document.getElementById('setKeyMode');
const btnSetScreen = document.getElementById('setScreen');
const btnSetUI = document.getElementById('setUI');

function updateUIButtons() {
  btnSetJoy.innerText = settings.joyMode === 'dynamic' ? '动态' : '固定';
  btnSetKey.innerText = settings.keyMode === 'hold' ? '长按' : '点击';
  btnSetScreen.innerText = settings.screen === 'free' ? '自由' : (settings.screen === 'landscape' ? '横屏' : '竖屏');
  btnSetUI.innerText = settings.showUI ? '显示' : '隐藏';
  const els = [btnA, btnB];
  els.forEach(el => settings.showUI ? el.classList.remove('hidden') : el.classList.add('hidden'));
}

btnSetJoy.onclick = () => { settings.joyMode = settings.joyMode === 'dynamic' ? 'fixed' : 'dynamic'; updateUIButtons(); resetJoy(); };
btnSetKey.onclick = () => { settings.keyMode = settings.keyMode === 'hold' ? 'click' : 'hold'; updateUIButtons(); };
btnSetScreen.onclick = () => {
  settings.screen = settings.screen === 'free' ? 'landscape' : (settings.screen === 'landscape' ? 'portrait' : 'free');
  updateUIButtons();
};
btnSetUI.onclick = () => { settings.showUI = !settings.showUI; updateUIButtons(); };
updateUIButtons();

function applyScreenOrientation() {
  if (settings.screen === 'landscape') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  } else if (settings.screen === 'portrait') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
  } else {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
}

// ================= 自定义键位模式 =================
document.getElementById('enterLayoutMode').onclick = () => {
  settingsPanel.style.display = 'none';
  layoutPanel.style.display = 'flex';
  layoutHint.style.display = 'block';
  settings.isLayoutMode = true;
  dynamicSettings.innerHTML = '<p style="font-size:12px; color:#aaa;">点击场景中的摇杆、A、B或头像</p>';
};

document.getElementById('exitLayoutMode').onclick = () => {
  layoutPanel.style.display = 'none';
  layoutHint.style.display = 'none';
  settings.isLayoutMode = false;
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  updateUIVisuals();
};

document.getElementById('toggleCollapse').onclick = () => {
  layoutPanel.classList.toggle('collapsed');
  document.getElementById('toggleCollapse').innerText = layoutPanel.classList.contains('collapsed') ? '▲' : '▼';
};

function updateUIVisuals() {
  btnA.style.transform = `scale(${settings.btnACfg.size})`;
  btnA.style.opacity = settings.btnACfg.alpha;
  btnB.style.transform = `scale(${settings.btnBCfg.size})`;
  btnB.style.opacity = settings.btnBCfg.alpha;
}

// 动态生成滑块
function buildSlider(label, val, min, max, cb) {
  let div = document.createElement('div');
  div.className = 'setting-row';
  div.innerHTML = `<span>${label}: <span id="val-${label}">${Math.round(val*100)}%</span></span>`;
  let input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = 0.05; input.value = val;
  input.oninput = (e) => {
    let v = parseFloat(e.target.value);
    document.getElementById(`val-${label}`).innerText = Math.round(v*100) + '%';
    cb(v);
  };
  div.appendChild(input);
  return div;
}

function selectUIElement(target) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  dynamicSettings.innerHTML = '';
  
  if (target === 'joy') {
    dynamicSettings.innerHTML = '<h3 style="margin:0; color:#4dabf7;">摇杆设置</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.joyCfg.size, 0.5, 1.5, v => settings.joyCfg.size = v));
    dynamicSettings.appendChild(buildSlider('透明度', settings.joyCfg.alpha, 0.1, 1, v => settings.joyCfg.alpha = v));
    
    let toggleBtn = document.createElement('button');
    toggleBtn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
    toggleBtn.onclick = () => {
      settings.joyCfg.showHead = !settings.joyCfg.showHead;
      toggleBtn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
    };
    dynamicSettings.appendChild(toggleBtn);
  } 
  else if (target === 'btnA') {
    btnA.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0; color:#4dabf7;">A键设置</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.btnACfg.size, 0.5, 1.5, v => {settings.btnACfg.size = v; updateUIVisuals();}));
    dynamicSettings.appendChild(buildSlider('透明度', settings.btnACfg.alpha, 0.1, 1, v => {settings.btnACfg.alpha = v; updateUIVisuals();}));
  }
  else if (target === 'btnB') {
    btnB.classList.add('dragging');
    dynamicSettings.innerHTML = '<h3 style="margin:0; color:#4dabf7;">B键设置</h3>';
    dynamicSettings.appendChild(buildSlider('大小', settings.btnBCfg.size, 0.5, 1.5, v => {settings.btnBCfg.size = v; updateUIVisuals();}));
    dynamicSettings.appendChild(buildSlider('透明度', settings.btnBCfg.alpha, 0.1, 1, v => {settings.btnBCfg.alpha = v; updateUIVisuals();}));
  }
  else if (target === 'player') {
    dynamicSettings.innerHTML = '<h3 style="margin:0; color:#4dabf7;">头像/玩家设置</h3>';
    let toggleArrow = document.createElement('button');
    toggleArrow.innerText = '卫星箭头: ' + (settings.arrowCfg.show ? '显示' : '隐藏');
    toggleArrow.onclick = () => {
      settings.arrowCfg.show = !settings.arrowCfg.show;
      toggleArrow.innerText = '卫星箭头: ' + (settings.arrowCfg.show ? '显示' : '隐藏');
    };
    dynamicSettings.appendChild(toggleArrow);
    dynamicSettings.innerHTML += '<p style="font-size:12px; color:#ff6b9d; margin-top:10px;">注: 头像不可调节大小/透明度</p>';
  }
}

// ================= 拖拽功能 (仅在调整模式生效) =================
let dragTarget = null;
function initDrag(el, type) {
  el.addEventListener('touchstart', e => {
    if (!settings.isLayoutMode) return;
    e.preventDefault(); e.stopPropagation();
    dragTarget = { el: el, startX: e.touches[0].clientX, startY: e.touches[0].clientY, initL: el.offsetLeft, initT: el.offsetTop };
    selectUIElement(type);
  }, {passive: false});
}
initDrag(btnA, 'btnA');
initDrag(btnB, 'btnB');

window.addEventListener('touchmove', e => {
  if (!dragTarget) return;
  e.preventDefault();
  let dx = e.touches[0].clientX - dragTarget.startX;
  let dy = e.touches[0].clientY - dragTarget.startY;
  dragTarget.el.style.left = (dragTarget.initL + dx) + 'px';
  dragTarget.el.style.top = (dragTarget.initT + dy) + 'px';
  dragTarget.el.style.bottom = 'auto';
  dragTarget.el.style.right = 'auto';
}, {passive: false});

window.addEventListener('touchend', () => dragTarget = null);


// ================= 游戏核心数据 =================
const P = {
  x: WORLD_W/2, y: WORLD_H/2, r: 16,
  vx: 0, vy: 0, accel: 0.6, friction: 0.92, maxSpeed: 5.5, // 降速了
  hp: 100, mhp: 100, displayHp: 100, // displayHp 用于残影血条
  pts: [], n: 5, ang: 0, fl: 0
};

function initP(n) {
  P.pts = [];
  for (let i = 0; i < n; i++) P.pts.push({ o: i * (Math.PI * 2 / n), cd: 0, r: 10 });
}
initP(P.n);

// 怪物的三种 AI 类型
const M = [], D = [];
function spawn() {
  let edge = Math.floor(rnd(0, 4)), x, y;
  // 在边界内生成
  x = rnd(MAP_MARGIN+50, WORLD_W-MAP_MARGIN-50);
  y = rnd(MAP_MARGIN+50, WORLD_H-MAP_MARGIN-50);
  
  let aiType = Math.floor(rnd(0, 3)); // 0:不动, 1:靠近才动, 2:挨打才动
  
  M.push({ 
    x, y, r: rnd(14, 22), hp: 40, mhp: 40, sp: rnd(.8, 1.2), 
    c: `hsl(${rnd(0, 360)},70%,55%)`, fl: 0, acd: 0,
    ai: aiType, state: 0 // state: 0静止, 1激活
  });
}

const rnd = (a, b) => a + Math.random() * (b - a);
const dst = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ================= 触摸/摇杆控制 =================
let joy = { act: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, id: null };
let JR = 60, KR = 30, FX = 100, FY = H - 120;

function resetJoy() {
  joy.act = false; joy.dx = 0; joy.dy = 0; joy.id = null;
}

cvs.addEventListener('touchstart', e => {
  if (!settings.showUI || settings.isLayoutMode) return;
  const t = e.changedTouches[0];
  const tx = t.clientX;
  const ty = t.clientY;
  
  // 如果是点按UI按钮区域，不触发摇杆
  if (tx > W - 200 && ty > H - 200) return; 

  if (joy.act) return;
  if (settings.joyMode === 'fixed') {
    joy.bx = FX; joy.by = FY; joy.kx = FX; joy.ky = FY;
  } else {
    joy.bx = tx; joy.by = ty; joy.kx = tx; joy.ky = ty;
  }
  joy.act = true; joy.id = t.identifier;
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joy.act) return;
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.bx, dy = t.clientY - joy.by;
      const dist = Math.hypot(dx, dy);
      if (dist > JR) { dx = (dx / dist) * JR; dy = (dy / dist) * JR; }
      joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
      joy.dx = dx / JR; joy.dy = dy / JR;
    }
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joy.id) resetJoy();
  }
});

// A/B 键逻辑
let currentPetalRadius = 46;
const maxPetalRadius = 90, minPetalRadius = 25;
let isALong = false, isBLong = false, isAClicked = false, isBClicked = false;
function handleDown(isA) {
  if (!settings.showUI || settings.isLayoutMode) return;
  if (settings.keyMode === 'hold') { if (isA) isALong = true; else isBLong = true; }
  else {
    if (isA) { isAClicked = !isAClicked; if(isAClicked) isBClicked = false; }
    else { isBClicked = !isBClicked; if(isBClicked) isAClicked = false; }
  }
}
btnA.addEventListener('touchstart', e => { e.preventDefault(); handleDown(true); });
btnA.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isALong = false; });
btnB.addEventListener('touchstart', e => { e.preventDefault(); handleDown(false); });
btnB.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isBLong = false; });

// 全屏双击功能
cvs.addEventListener('dblclick', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
});

// ================= 核心循环 =================
let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 16.67, 2);
  last = now;
  upd(dt);
  draw();
  requestAnimationFrame(loop);
}

function upd(dt) {
  if (settings.isLayoutMode) return; // 调整模式暂停游戏

  // 花瓣半径控制
  let targetRadius = 46;
  if (isALong || isAClicked) targetRadius = maxPetalRadius;
  if (isBLong || isBClicked) targetRadius = minPetalRadius;
  if (currentPetalRadius < targetRadius) currentPetalRadius = Math.min(currentPetalRadius + 3 * dt, targetRadius);
  if (currentPetalRadius > targetRadius) currentPetalRadius = Math.max(currentPetalRadius - 3 * dt, targetRadius);

  // 物理引擎
  if (joy.act) {
    P.vx += joy.dx * P.accel * dt;
    P.vy += joy.dy * P.accel * dt;
  }
  P.vx *= Math.pow(P.friction, dt);
  P.vy *= Math.pow(P.friction, dt);
  let spd = Math.hypot(P.vx, P.vy);
  if (spd > P.maxSpeed) {
    P.vx = (P.vx / spd) * P.maxSpeed;
    P.vy = (P.vy / spd) * P.maxSpeed;
  }
  
  P.x += P.vx * dt; P.y += P.vy * dt;

  // 视觉边界碰撞
  if (P.x < MAP_MARGIN + P.r) { P.x = MAP_MARGIN + P.r; P.vx *= -0.5; }
  if (P.x > WORLD_W - MAP_MARGIN - P.r) { P.x = WORLD_W - MAP_MARGIN - P.r; P.vx *= -0.5; }
  if (P.y < MAP_MARGIN + P.r) { P.y = MAP_MARGIN + P.r; P.vy *= -0.5; }
  if (P.y > WORLD_H - MAP_MARGIN - P.r) { P.y = WORLD_H - MAP_MARGIN - P.r; P.vy *= -0.5; }

  // 残影血条逻辑
  if (P.displayHp > P.hp) P.displayHp -= 0.5 * dt; // 假血掉得慢
  if (P.displayHp < P.hp) P.displayHp = P.hp; // 回血瞬间回满

  P.ang += .04 * dt;
  P.pts.forEach(p => { if (p.cd > 0) p.cd -= dt; });
  
  if (M.length < 15 && Math.random() < .05) spawn();

  for (let i = M.length - 1; i >= 0; i--) {
    let m = M[i];
    if (m.fl > 0) m.fl -= dt;
    if (m.acd > 0) m.acd -= dt;
    let dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy);

    // 怪物 AI
    if (m.ai === 1 && d < 250) m.state = 1; // 靠近激活
    if (m.state === 1) {
      if (d > 1) { m.x += dx / d * m.sp * dt; m.y += dy / d * m.sp * dt; }
    }

    // 物理碰撞弹开 (怪物撞玩家 / 玩家撞怪物)
    if (d < m.r + P.r) {
      let angle = Math.atan2(P.y - m.y, P.x - m.x);
      let overlap = (m.r + P.r) - d;
      // 互相弹开
      P.x += Math.cos(angle) * overlap * 0.5;
      P.y += Math.sin(angle) * overlap * 0.5;
      m.x -= Math.cos(angle) * overlap * 0.5;
      m.y -= Math.sin(angle) * overlap * 0.5;
      // 弹开速度
      P.vx += Math.cos(angle) * 2; P.vy += Math.sin(angle) * 2;
      
      if (m.acd <= 0) { P.hp -= 8; P.fl = 8; m.acd = 40; }
    }

    // 花瓣打怪
    for (let p of P.pts) {
      if (p.cd > 0) continue;
      let a = P.ang + p.o, px = P.x + Math.cos(a) * currentPetalRadius, py = P.y + Math.sin(a) * currentPetalRadius;
      if (dst({ x: px, y: py }, m) < p.r + m.r) {
        m.hp -= 12; m.fl = 8; p.cd = 20; 
        m.state = 1; // 挨打必激活
        break;
      }
    }
    if (m.hp <= 0) { D.push({ x: m.x, y: m.y, r: 8, t: 10 }); M.splice(i, 1); } // t=10 寿命
  }

  // 掉落物寿命
  for (let i = D.length - 1; i >= 0; i--) {
    let d = D[i]; d.t -= dt;
    if (dst(d, P) < P.r + d.r) { P.n = Math.min(P.n + 1, 10); initP(P.n); D.splice(i, 1); }
    else if (d.t <= 0) { D.splice(i, 1); }
  }
  
  if (P.hp <= 0) {
    P.hp = P.mhp; P.displayHp = P.mhp; P.x = WORLD_W/2; P.y = WORLD_H/2; P.vx=0; P.vy=0;
    M.length = 0; P.n = 5; initP(5);
  }
  if (P.fl > 0) P.fl -= dt;
}

// ================= 渲染 =================
let miniMapScale = 0; // 0:小, 1:中, 2:大居中
function draw() {
  // 相机跟随玩家
  cam.x = P.x - W / 2;
  cam.y = P.y - H / 2;

  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  
  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // 画网格
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < WORLD_W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_H); ctx.stroke(); }
  for (let i = 0; i < WORLD_H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_W, i); ctx.stroke(); }

  // 画地图边界 (视觉红线)
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = MAP_MARGIN * 2;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H); // 用粗线框住边缘

  // 掉落物 (带闪烁)
  D.forEach(d => {
    ctx.globalAlpha = d.t < 3 ? (Math.sin(d.t * 20) > 0 ? 1 : 0.2) : 1;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fillStyle = '#ffd93d'; ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 怪物 (带暗色描边)
  M.forEach(m => {
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7);
    ctx.fillStyle = m.fl > 0 ? '#fff' : m.c; ctx.fill();
    // 这里用偏黑的颜色做描边模拟暗色，或者用原生颜色的alpha
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 4; ctx.stroke();
    // 状态圈
    if (m.ai === 1 && m.state === 0) { ctx.beginPath(); ctx.arc(m.x, m.y, 250, 0, 7); ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=2; ctx.stroke(); }
  });

  // 花瓣
  P.pts.forEach(p => {
    if (p.cd > 0) return;
    let a = P.ang + p.o;
    ctx.beginPath();
    ctx.arc(P.x + Math.cos(a) * currentPetalRadius, P.y + Math.sin(a) * currentPetalRadius, p.r, 0, 7);
    ctx.fillStyle = '#ff6b9d'; ctx.fill();
  });

  // 玩家本体 (圆球)
  ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, 7);
  ctx.fillStyle = P.fl > 0 ? '#f44' : '#4dabf7'; ctx.fill();
  ctx.strokeStyle = '#1c5a8a'; ctx.lineWidth = 4; ctx.stroke();

  // 卫星箭头
  if (settings.arrowCfg.show && (Math.abs(P.vx) > 0.5 || Math.abs(P.vy) > 0.5)) {
    let angle = Math.atan2(P.vy, P.vx);
    let dist = P.r + 15;
    ctx.save();
    ctx.translate(P.x + Math.cos(angle)*dist, P.y + Math.sin(angle)*dist);
    ctx.rotate(angle);
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-4,-6); ctx.lineTo(-4,6);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // 恢复坐标系

  // 绘制固定UI
  if (settings.showUI) {
    if (settings.joyMode === 'fixed' && !joy.act) drawJoy(FX, FY, FX, FY, 0, 0, false);
    else if (joy.act) drawJoy(joy.bx, joy.by, joy.kx, joy.ky, joy.dx, joy.dy, true);

    // 左上角玩家状态
    let hx = 60, hy = 60;
    ctx.beginPath(); ctx.arc(hx, hy, 20, 0, 7); ctx.fillStyle = '#4dabf7'; ctx.fill();
    ctx.strokeStyle = '#1c5a8a'; ctx.lineWidth = 3; ctx.stroke();
    
    // 血条底框
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(hx + 30, hy - 12, 120, 24);
    // 残影血条 (深红)
    ctx.fillStyle = '#8b0000'; ctx.fillRect(hx + 30, hy - 12, 120 * Math.max(0, P.displayHp / P.mhp), 24);
    // 真实血条 (亮红)
    ctx.fillStyle = '#ff4444'; ctx.fillRect(hx + 30, hy - 12, 120 * Math.max(0, P.hp / P.mhp), 24);
    // 数字
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.round(P.hp)}/${P.mhp}`, hx + 45, hy + 1);
    
    // 点击头像进入专属设置
    if (settings.isLayoutMode) {
      ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 3; ctx.strokeRect(hx-22, hy-22, 44, 44);
    }
  }
}

function drawJoy(bx, by, kx, ky, dx, dy, active) {
  ctx.globalAlpha = active ? 1 : settings.joyCfg.alpha;
  let size = settings.joyCfg.size;
  let jr = JR * size, kr = KR * size;
  
  ctx.beginPath(); ctx.arc(bx, by, jr, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  
  if (settings.joyCfg.showHead) {
    ctx.beginPath(); ctx.arc(kx, ky, kr, 0, 7);
    ctx.fillStyle = 'rgba(77, 171, 247, 0.8)'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

requestAnimationFrame(loop);
</script>
