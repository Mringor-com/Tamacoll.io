<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>花瓣游戏</title>
<style>
* { -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  overflow: hidden;
  background: #1a1a2e;
  touch-action: none;
  user-select: none;
  font-family: sans-serif;
  color: #fff;
}
canvas { display: block; }
.ui-btn {
  position: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  z-index: 10;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.5);
  transition: transform .12s ease, opacity .18s ease;
}
.ui-btn .label {
  transition: opacity .4s ease;
  opacity: 1;
}
.ui-btn.pressed { transform: scale(.94); }
#btnA { width: 70px; height: 70px; bottom: 120px; right: 30px; font-size: 28px; }
#btnB { width: 70px; height: 70px; bottom: 30px; right: 120px; font-size: 28px; }
#btnSettings {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 45px;
  height: 45px;
  border-radius: 12px;
  background: rgba(255,255,255,.2);
  border: 2px solid rgba(255,255,255,.5);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  z-index: 100;
  cursor: pointer;
  transition: transform .12s ease, opacity .18s ease;
}
#btnSettings.pressed { transform: scale(.94); }

#minimapContainer {
  position: fixed;
  top: 20px;
  right: 80px;
  width: 80px;
  height: 80px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,.6);
  overflow: hidden;
  z-index: 50;
  background: #000;
  transition: width .3s cubic-bezier(.25,.8,.3,1),
              height .3s cubic-bezier(.25,.8,.3,1),
              top .3s cubic-bezier(.25,.8,.3,1),
              left .3s cubic-bezier(.25,.8,.3,1),
              right .3s cubic-bezier(.25,.8,.3,1),
              transform .12s ease,
              opacity .18s ease;
}
#minimapContainer.pressed { transform: scale(.94); }
#minimapCanvas { width: 100%; height: 100%; display: block; }

.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%) scale(.9);
  opacity: 0;
  pointer-events: none;
  background: rgba(20,25,40,.95);
  border: 2px solid #4dabf7;
  border-radius: 20px;
  padding: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.8);
  transition: transform .25s cubic-bezier(.175,.885,.32,1.275), opacity .25s, height .3s ease;
}
.panel.show {
  transform: translate(-50%,-50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}
.panel h2 { margin: 0 0 10px 0; text-align: center; color: #4dabf7; font-size: 20px; }
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  width: 100%;
  gap: 10px;
}
.setting-row > span { white-space: nowrap; }
.setting-row button {
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #4dabf7;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  min-width: 70px;
  transition: transform .12s ease;
}
.setting-row button:active { transform: scale(.94); }

/* 滑块变短 */
.setting-row input[type="range"] {
  flex: 0 0 50px;
  margin: 0 6px;
  accent-color: #4dabf7;
  height: 6px;
  border-radius: 3px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.2);
}
.setting-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #4dabf7;
}

.pct-value {
  cursor: pointer;
  color: #4dabf7;
  font-weight: bold;
  border-bottom: 1px dashed #4dabf7;
  min-width: 42px;
  text-align: center;
}
.close-x {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  color: #ff6b9d;
  cursor: pointer;
  font-weight: bold;
}
#settingsPanel { width: 85%; max-width: 350px; }
#layoutPanel {
  top: 15px;
  left: 15px;
  transform: scale(.9);
  opacity: 0;
  pointer-events: none;
  padding: 15px 15px 30px 15px;
  width: 240px;
  border-color: #ffd93d;
  border-radius: 15px;
  transition: transform .25s cubic-bezier(.175,.885,.32,1.275), opacity .25s, height .35s ease;
}
#layoutPanel.show {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

/* 抽屉效果（无淡入淡出） */
#layoutContent {
  overflow: hidden;
  transition: max-height .3s ease;
  max-height: 1200px;
}
#layoutPanel.collapsed #layoutContent {
  max-height: 0;
}
#layoutPanel.collapsed h2 { margin: 0; font-size: 16px; }
#toggleCollapse {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  padding: 0;
  min-width: 30px;
  transition: transform .12s ease;
}
#toggleCollapse:active { transform: scale(.94); }

#layoutPanel-header {
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  border-bottom: 1px solid rgba(255,255,255,.2);
  padding-bottom: 5px;
  margin-bottom: 10px;
}
.dynamic-inner { transition: opacity .18s ease; }
.dynamic-inner.fade { opacity: 0; }

#exitLayoutMode {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #ff6b9d;
  color: #fff;
  font-weight: bold;
  transition: transform .12s ease;
}
#exitLayoutMode:active { transform: scale(.94); }

.dragging {
  border: 2px dashed #ffd93d !important;
  box-shadow: 0 0 15px #ffd93d;
  z-index: 999;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btnA" class="ui-btn"><span class="label">A</span></div>
<div id="btnB" class="ui-btn"><span class="label">B</span></div>
<div id="btnSettings">⚙️</div>
<div id="minimapContainer"><canvas id="minimapCanvas"></canvas></div>
<div id="settingsPanel" class="panel">
  <span class="close-x" onclick="closeSettingsPanel()">×</span>
  <h2>游戏设置</h2>
  <div class="setting-row"><span>摇杆模式</span><button id="setJoyMode">动态</button></div>
  <div class="setting-row"><span>按键模式</span><button id="setKeyMode">长按</button></div>
  <div class="setting-row"><span>屏幕方向</span><button id="setScreen">自由</button></div>
  <div class="setting-row"><span>自定义键位</span><button id="enterLayoutMode" style="background:#ff6b9d;">进入调整</button></div>
</div>
<div id="layoutPanel" class="panel">
  <div id="layoutPanel-header">
    <h2>调整键位</h2>
    <button id="toggleCollapse">▼</button>
  </div>
  <div id="layoutContent">
    <p style="font-size:12px;color:#aaa;margin:0 0 10px 0;">点击场景元素调专属设置：</p>
    <div id="dynamicSettings" class="dynamic-inner" style="display:flex;flex-direction:column;gap:10px;"></div>
    <button id="exitLayoutMode">保存并退出</button>
  </div>
</div>
<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const minimapContainer = document.getElementById('minimapContainer');
const minimapCanvas = document.getElementById('minimapCanvas');
const mmCtx = minimapCanvas.getContext('2d');

let W, H;
function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
  syncMinimapSize();
}
function syncMinimapSize() {
  const r = minimapContainer.getBoundingClientRect();
  minimapCanvas.width = Math.max(1, Math.floor(r.width));
  minimapCanvas.height = Math.max(1, Math.floor(r.height));
}
resize();
window.addEventListener('resize', resize);

const WORLD = 3000;
const MARGIN = 50;
const MAXR = WORLD - MARGIN;

let settings = {
  joyMode: 'dynamic',
  keyMode: 'hold',
  screen: 'free',
  isLayoutMode: false,
  showUI: true,
  arrowStyle: 1,
  avatarCfg: { size: 1, alpha: 1 },
  hpBarCfg: { size: 1, alpha: 1, showNumber: true, showDmg: true },
  joyCfg: { size: 1, alpha: 1, showHead: true },
  btnACfg: { size: 1, alpha: 1 },
  btnBCfg: { size: 1, alpha: 1 },
  monstCfg: { alpha: 1, showHpBar: true, showHpNum: true, showDmg: true },
  pPreviewCfg: { alpha: 1, showHpBar: true, showHpNum: true, showDmg: true },
  gearCfg: { size: 1, alpha: 1 },
  mapCfg: { size: 1, alpha: 1, expandDir: 'rightbottom' }
};

const uiPos = {
  avatar: { x: 60, y: 60 },
  hpBar: { x: 160, y: 60 },
  joy: { x: 100, y: null }
};

const cur = {
  joySize: 1, joyAlpha: 1,
  avatarSize: 1, avatarAlpha: 1,
  hpSize: 1, hpAlpha: 1,
  hpBarDisplay: 100, hpBarDisplayRed: 100
};

const hl = { avatar: 0, hpBar: 0, joy: 0, fakeMonster: 0, pPreview: 0, pPreviewHp: 0 };
let hlTarget = null;

const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const btnSettings = document.getElementById('btnSettings');
const settingsPanel = document.getElementById('settingsPanel');
const layoutPanel = document.getElementById('layoutPanel');
const dynamicSettings = document.getElementById('dynamicSettings');

function animatePanelHeight() {
  if (layoutPanel.classList.contains('collapsed')) {
    layoutPanel.style.height = '60px';
  } else {
    const target = layoutPanel.querySelector('#layoutContent').scrollHeight + 60;
    layoutPanel.style.height = target + 'px';
  }
}

function openSettingsPanel() { settingsPanel.classList.add('show'); }
function closeSettingsPanel() {
  settingsPanel.classList.remove('show');
  applyScreenOrientation();
}

window.addEventListener('touchstart', e => {
  if (!settingsPanel.classList.contains('show')) return;
  if (settingsPanel.contains(e.target)) return;
  if (e.target === btnSettings) return;
  closeSettingsPanel();
}, { passive: false });

btnSettings.onclick = () => {
  if (!settings.isLayoutMode) openSettingsPanel();
};

const btnSetJoy = document.getElementById('setJoyMode');
const btnSetKey = document.getElementById('setKeyMode');
const btnSetScreen = document.getElementById('setScreen');

function updateUIButtons() {
  btnSetJoy.innerText = settings.joyMode === 'dynamic' ? '动态' : '固定';
  btnSetKey.innerText = settings.keyMode === 'hold' ? '长按' : '点击';
  btnSetScreen.innerText = settings.screen === 'free' ? '自由' : (settings.screen === 'landscape' ? '横屏' : '竖屏');
}
btnSetJoy.onclick = () => {
  settings.joyMode = settings.joyMode === 'dynamic' ? 'fixed' : 'dynamic';
  updateUIButtons();
  resetJoy();
};
btnSetKey.onclick = () => {
  settings.keyMode = settings.keyMode === 'hold' ? 'click' : 'hold';
  updateUIButtons();
};
btnSetScreen.onclick = () => {
  settings.screen = settings.screen === 'free' ? 'landscape' : (settings.screen === 'landscape' ? 'portrait' : 'free');
  updateUIButtons();
};
updateUIButtons();

function applyScreenOrientation() {
  if (settings.screen === 'landscape') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } else if (settings.screen === 'portrait') {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
  } else {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
}

document.getElementById('enterLayoutMode').onclick = () => {
  closeSettingsPanel();
  layoutPanel.classList.add('show');
  settings.isLayoutMode = true;
  dynamicSettings.innerHTML = '<p style="font-size:12px;color:#aaa;">点击场景元素进行专属调整</p>';
  animatePanelHeight();
};
document.getElementById('exitLayoutMode').onclick = () => {
  layoutPanel.classList.remove('show');
  settings.isLayoutMode = false;
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  hlTarget = null;
  updateUIVisuals();
};
document.getElementById('toggleCollapse').onclick = () => {
  layoutPanel.classList.toggle('collapsed');
  document.getElementById('toggleCollapse').innerText = layoutPanel.classList.contains('collapsed') ? '▲' : '▼';
  animatePanelHeight();
};

let isDraggingPanel = false, panelStartX, panelStartY, panelInitX, panelInitY;
document.getElementById('layoutPanel-header').addEventListener('touchstart', e => {
  isDraggingPanel = true;
  let t = e.touches[0];
  panelStartX = t.clientX;
  panelStartY = t.clientY;
  let rect = layoutPanel.getBoundingClientRect();
  panelInitX = rect.left;
  panelInitY = rect.top;
  layoutPanel.style.transform = 'none';
  layoutPanel.style.left = panelInitX + 'px';
  layoutPanel.style.top = panelInitY + 'px';
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (isDraggingPanel) {
    let t = e.touches[0];
    layoutPanel.style.left = (panelInitX + t.clientX - panelStartX) + 'px';
    layoutPanel.style.top = (panelInitY + t.clientY - panelStartY) + 'px';
  }
}, { passive: false });
window.addEventListener('touchend', () => isDraggingPanel = false);

function buildSlider(label, val, min, max, cb) {
  let div = document.createElement('div');
  div.className = 'setting-row';
  let span = document.createElement('span');
  span.innerText = label + ': ';
  let pct = document.createElement('span');
  pct.className = 'pct-value';
  pct.innerText = Math.round(val * 100) + '%';
  span.appendChild(pct);
  div.appendChild(span);

  let input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = .05;
  input.value = val;
  input.oninput = (e) => {
    let v = parseFloat(e.target.value);
    pct.innerText = Math.round(v * 100) + '%';
    cb(v);
  };
  div.appendChild(input);

  pct.onclick = () => {
    let curVal = Math.round(parseFloat(input.value) * 100);
    let s = prompt('输入百分比 (' + Math.round(min * 100) + ' ~ ' + Math.round(max * 100) + ')', curVal);
    if (s === null) return;
    let n = parseFloat(s);
    if (isNaN(n)) return;
    n = Math.min(max, Math.max(min, n / 100));
    input.value = n;
    pct.innerText = Math.round(n * 100) + '%';
    cb(n);
  };
  return div;
}

function buildExpandDirRow() {
  let div = document.createElement('div');
  div.className = 'setting-row';
  let span = document.createElement('span');
  span.innerText = '第一次放大方向';
  div.appendChild(span);
  let btn = document.createElement('button');
  const dirNames = { lefttop: '左上', righttop: '右上', leftbottom: '左下', rightbottom: '右下' };
  btn.innerText = dirNames[settings.mapCfg.expandDir];
  btn.onclick = () => {
    const order = ['lefttop', 'righttop', 'leftbottom', 'rightbottom'];
    let i = order.indexOf(settings.mapCfg.expandDir);
    settings.mapCfg.expandDir = order[(i + 1) % 4];
    btn.innerText = dirNames[settings.mapCfg.expandDir];
  };
  div.appendChild(btn);
  return div;
}

function updateUIVisuals() {
  btnA.style.transform = `scale(${settings.btnACfg.size})`;
  btnA.style.opacity = settings.btnACfg.alpha;
  btnB.style.transform = `scale(${settings.btnBCfg.size})`;
  btnB.style.opacity = settings.btnBCfg.alpha;
  btnSettings.style.transform = `scale(${settings.gearCfg.size})`;
  btnSettings.style.opacity = settings.gearCfg.alpha;
  minimapContainer.style.opacity = settings.mapCfg.alpha;
  syncMinimapSize();
}

function setDynamicContent(html, build) {
  dynamicSettings.classList.add('fade');
  setTimeout(() => {
    dynamicSettings.innerHTML = html;
    if (build) build();
    dynamicSettings.classList.remove('fade');
    animatePanelHeight();
  }, 180);
}

function selectUIElement(target) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  hlTarget = target;
  if (target === 'joy') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">摇杆设置</h3>';
      dynamicSettings.appendChild(buildSlider('大小', settings.joyCfg.size, .5, 1.5, v => settings.joyCfg.size = v));
      dynamicSettings.appendChild(buildSlider('透明度', settings.joyCfg.alpha, .1, 1, v => settings.joyCfg.alpha = v));
      let btn = document.createElement('button');
      btn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
      btn.onclick = () => {
        settings.joyCfg.showHead = !settings.joyCfg.showHead;
        btn.innerText = '小球: ' + (settings.joyCfg.showHead ? '显示' : '隐藏');
      };
      dynamicSettings.appendChild(btn);
    });
  } else if (target === 'avatar') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">头像设置</h3>';
      dynamicSettings.appendChild(buildSlider('大小', settings.avatarCfg.size, .5, 1.5, v => settings.avatarCfg.size = v));
      dynamicSettings.appendChild(buildSlider('透明度', settings.avatarCfg.alpha, .1, 1, v => settings.avatarCfg.alpha = v));
    });
  } else if (target === 'hpBar') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">血条设置</h3>';
      dynamicSettings.appendChild(buildSlider('大小', settings.hpBarCfg.size, .5, 1.5, v => settings.hpBarCfg.size = v));
      dynamicSettings.appendChild(buildSlider('透明度', settings.hpBarCfg.alpha, .1, 1, v => settings.hpBarCfg.alpha = v));
      let btn = document.createElement('button');
      btn.innerText = '血量数值: ' + (settings.hpBarCfg.showNumber ? '显示' : '隐藏');
      btn.onclick = () => {
        settings.hpBarCfg.showNumber = !settings.hpBarCfg.showNumber;
        btn.innerText = '血量数值: ' + (settings.hpBarCfg.showNumber ? '显示' : '隐藏');
      };
      dynamicSettings.appendChild(btn);
      let btn2 = document.createElement('button');
      btn2.innerText = '伤害飘字: ' + (settings.hpBarCfg.showDmg ? '显示' : '隐藏');
      btn2.onclick = () => {
        settings.hpBarCfg.showDmg = !settings.hpBarCfg.showDmg;
        btn2.innerText = '伤害飘字: ' + (settings.hpBarCfg.showDmg ? '显示' : '隐藏');
      };
      dynamicSettings.appendChild(btn2);
    });
  } else if (target === 'player') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">玩家箭头</h3>';
      let btn2 = document.createElement('button');
      btn2.innerText = '切换箭头样式 (当前:' + settings.arrowStyle + ')';
      btn2.onclick = () => {
        settings.arrowStyle = settings.arrowStyle % 4 + 1;
        btn2.innerText = '切换箭头样式 (当前:' + settings.arrowStyle + ')';
      };
      dynamicSettings.appendChild(btn2);
    });
  } else if (target === 'pPreview') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">主角预览</h3>';
      dynamicSettings.appendChild(buildSlider('透明度', settings.pPreviewCfg.alpha, .1, 1, v => settings.pPreviewCfg.alpha = v));
    });
  } else if (target === 'pPreviewHp') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">主角预览血条</h3>';
      let btn1 = document.createElement('button');
      btn1.innerText = '显示血条: ' + (settings.pPreviewCfg.showHpBar ? '开' : '关');
      btn1.onclick = () => {
        settings.pPreviewCfg.showHpBar = !settings.pPreviewCfg.showHpBar;
        btn1.innerText = '显示血条: ' + (settings.pPreviewCfg.showHpBar ? '开' : '关');
      };
      let btn2 = document.createElement('button');
      btn2.innerText = '显示数值: ' + (settings.pPreviewCfg.showHpNum ? '开' : '关');
      btn2.onclick = () => {
        settings.pPreviewCfg.showHpNum = !settings.pPreviewCfg.showHpNum;
        btn2.innerText = '显示数值: ' + (settings.pPreviewCfg.showHpNum ? '开' : '关');
      };
      let btn3 = document.createElement('button');
      btn3.innerText = '伤害飘字: ' + (settings.pPreviewCfg.showDmg ? '开' : '关');
      btn3.onclick = () => {
        settings.pPreviewCfg.showDmg = !settings.pPreviewCfg.showDmg;
        btn3.innerText = '伤害飘字: ' + (settings.pPreviewCfg.showDmg ? '开' : '关');
      };
      dynamicSettings.appendChild(btn1);
      dynamicSettings.appendChild(btn2);
      dynamicSettings.appendChild(btn3);
    });
  } else if (target === 'fakeMonster') {
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">假怪设置</h3>';
      dynamicSettings.appendChild(buildSlider('透明度', settings.monstCfg.alpha, .1, 1, v => settings.monstCfg.alpha = v));
      let btn1 = document.createElement('button');
      btn1.innerText = '显示血条: ' + (settings.monstCfg.showHpBar ? '开' : '关');
      btn1.onclick = () => {
        settings.monstCfg.showHpBar = !settings.monstCfg.showHpBar;
        btn1.innerText = '显示血条: ' + (settings.monstCfg.showHpBar ? '开' : '关');
      };
      let btn2 = document.createElement('button');
      btn2.innerText = '显示数值: ' + (settings.monstCfg.showHpNum ? '开' : '关');
      btn2.onclick = () => {
        settings.monstCfg.showHpNum = !settings.monstCfg.showHpNum;
        btn2.innerText = '显示数值: ' + (settings.monstCfg.showHpNum ? '开' : '关');
      };
      let btn3 = document.createElement('button');
      btn3.innerText = '伤害飘字: ' + (settings.monstCfg.showDmg ? '开' : '关');
      btn3.onclick = () => {
        settings.monstCfg.showDmg = !settings.monstCfg.showDmg;
        btn3.innerText = '伤害飘字: ' + (settings.monstCfg.showDmg ? '开' : '关');
      };
      dynamicSettings.appendChild(btn1);
      dynamicSettings.appendChild(btn2);
      dynamicSettings.appendChild(btn3);
    });
  } else if (target === 'btnA') {
    btnA.classList.add('dragging');
    setDynamicContent('', () => {
      dynamicSettings.innerHTML = '<h3 style="margin:0;color:#4dabf7;">A 键</h3>';
      dynamicSettings.appendChild(buildSlider('大小', settings.btnACfg.size, .5, 1.5, v => { settings.btnACfg.size = v; updateUIVisuals(); }));
      dynamicSettings.appendChild(buildSlider('透明度', settings.btnACfg.alpha, .1, 1, v => { settings.btnACfg.alpha = v; updateUIVisuals(); }));
    });

function initDrag(el, type) {
  el.addEventListener('touchstart', e => {
    if (!settings.isLayoutMode) return;
    e.preventDefault();
    e.stopPropagation();
    let t = e.touches[0];
    let startX = t.clientX, startY = t.clientY;
    let rect = el.getBoundingClientRect();
    selectUIElement(type);
    el.classList.add('pressed');
    function onMove(me) {
      let mt = me.touches[0];
      el.style.left = (rect.left + mt.clientX - startX) + 'px';
      el.style.top = (rect.top + mt.clientY - startY) + 'px';
      el.style.bottom = 'auto';
      el.style.right = 'auto';
    }
    function onEnd() {
      el.classList.remove('pressed');
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);
    }
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
  }, { passive: false });
}
initDrag(btnA, 'btnA');
initDrag(btnB, 'btnB');
initDrag(btnSettings, 'gear');
initDrag(minimapContainer, 'map');

const P = {
  x: WORLD / 2, y: WORLD / 2, r: 16,
  vx: 0, vy: 0, accel: .45, friction: .88, maxSpeed: 4,
  hp: 100, mhp: 100, displayHp: 100,
  pts: [], n: 5, ang: 0, fl: 0, redFlash: 0,
  arrowAlpha: 0, stillTimer: 0, arrowAngle: 0, arrowTargetAngle: 0
};

function initP(n, initialCd = 0) {
  let oldPts = P.pts;
  P.pts = [];
  for (let i = 0; i < n; i++) {
    let targetO = i * (Math.PI * 2 / n);
    let currentO = targetO;
    if (oldPts && oldPts[i]) {
      currentO = oldPts[i].o;
    } else {
      currentO = targetO;
    }
    let isNew = (i === n - 1) && initialCd > 0;
    P.pts.push({ 
      o: currentO, 
      targetO: targetO,
      cd: isNew ? initialCd : 0, 
      r: 10, 
      appear: isNew ? 0 : 1, 
      pop: isNew ? 0 : 1 // 从0开始，产生从中心弹出的动画
    });
  }
}
initP(P.n);

const M = [], D = [], DMG_TEXTS = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const dst = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const cam = { x: P.x - W / 2, y: P.y - H / 2 };

let joy = { act: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, id: null, visAlpha: 0, displayKx: 0, displayKy: 0 };
let JR = 60, KR = 30;
let FX = 100, FY = H - 120;
let joyFixedStill = 0;

function resetJoy() {
  joy.act = false;
  joy.dx = 0;
  joy.dy = 0;
  joy.id = null;
}

cvs.addEventListener('touchstart', e => {
  if (!settings.showUI || settings.isLayoutMode) return;
  if (settingsPanel.classList.contains('show')) return;
  const t = e.changedTouches[0], tx = t.clientX, ty = t.clientY;
  if (joy.act) return;
  if (settings.joyMode === 'fixed') {
    joy.bx = uiPos.joy.x;
    joy.by = uiPos.joy.y !== null ? uiPos.joy.y : FY;
    joy.kx = joy.bx;
    joy.ky = joy.by;
  } else {
    joy.bx = tx; joy.by = ty;
    joy.kx = tx; joy.ky = ty;
  }
  joy.displayKx = joy.bx;
  joy.displayKy = joy.by;
  joy.act = true;
  joy.id = t.identifier;
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joy.act || settings.isLayoutMode) return;
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.bx, dy = t.clientY - joy.by;
      const dist = Math.hypot(dx, dy);
      if (dist > JR) {
        dx = dx / dist * JR;
        dy = dy / dist * JR;
      }
      joy.kx = joy.bx + dx;
      joy.ky = joy.by + dy;
      joy.dx = dx / JR;
      joy.dy = dy / JR;
    }
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++)
    if (e.changedTouches[i].identifier === joy.id) resetJoy();
});

let currentPetalRadius = 46;
const maxPetalRadius = 90, minPetalRadius = 25;
let isALong = false, isBLong = false, isAClicked = false, isBClicked = false;

function handleDown(isA) {
  if (!settings.showUI || settings.isLayoutMode) return;
  if (settingsPanel.classList.contains('show')) return;
  if (settings.keyMode === 'hold') {
    if (isA) isALong = true; else isBLong = true;
  } else {
    if (isA) {
      isAClicked = !isAClicked;
      if (isAClicked) isBClicked = false;
    } else {
      isBClicked = !isBClicked;
      if (isBClicked) isAClicked = false;
    }
  }
}
btnA.addEventListener('touchstart', e => { e.preventDefault(); handleDown(true); });
btnA.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isALong = false; });
btnB.addEventListener('touchstart', e => { e.preventDefault(); handleDown(false); });
btnB.addEventListener('touchend', e => { e.preventDefault(); if (settings.keyMode === 'hold') isBLong = false; });

cvs.addEventListener('dblclick', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
});

let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 16.67, 2);
  last = now;
  if (!settings.isLayoutMode) upd(dt);

  cur.joySize += (settings.joyCfg.size - cur.joySize) * .2 * dt;
  cur.joyAlpha += (settings.joyCfg.alpha - cur.joyAlpha) * .2 * dt;
  cur.avatarSize += (settings.avatarCfg.size - cur.avatarSize) * .2 * dt;
  cur.avatarAlpha += (settings.avatarCfg.alpha - cur.avatarAlpha) * .2 * dt;
  cur.hpSize += (settings.hpBarCfg.size - cur.hpSize) * .2 * dt;
  cur.hpAlpha += (settings.hpBarCfg.alpha - cur.hpAlpha) * .2 * dt;

  if (!joy.act) {
    joy.displayKx += (joy.bx - joy.displayKx) * 0.2 * dt;
    joy.displayKy += (joy.by - joy.displayKy) * 0.2 * dt;
  } else {
    joy.displayKx = joy.kx;
    joy.displayKy = joy.ky;
  }

  let joyTarget;
  if (settings.joyMode === 'fixed') {
    if (joy.act) joyFixedStill = 0;
    else joyFixedStill += dt / 60;
    joyTarget = (joyFixedStill >= 50) ? 0 : 1;
  } else {
    joyTarget = joy.act ? 1 : 0;
  }
  joy.visAlpha += (joyTarget - joy.visAlpha) * .15 * dt;

  breathPhase += dt * 0.15;
  let breath = 0.75 + 0.25 * Math.sin(breathPhase);
  if (labelA) labelA.style.opacity = breath;
  if (labelB) labelB.style.opacity = breath;

  for (let k in hl) {
    let t = (hlTarget === k) ? 1 : 0;
    hl[k] += (t - hl[k]) * .2 * dt;
  }

  draw();
  requestAnimationFrame(loop);
}

function clampBound(o, isPlayer) {
  let hit = false;
  if (o.x < MARGIN + o.r) {
    o.x = MARGIN + o.r;
    if (isPlayer || o.vx !== undefined) o.vx = 0;
    hit = true;
  } else if (o.x > MAXR - o.r) {
    o.x = MAXR - o.r;
    if (isPlayer || o.vx !== undefined) o.vx = 0;
    hit = true;
  }
  if (o.y < MARGIN + o.r) {
    o.y = MARGIN + o.r;
    if (isPlayer || o.vy !== undefined) o.vy = 0;
    hit = true;
  } else if (o.y > MAXR - o.r) {
    o.y = MAXR - o.r;
    if (isPlayer || o.vy !== undefined) o.vy = 0;
    hit = true;
  }
  return hit;
}

function shortestAngle(from, to) {
  let d = to - from;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function upd(dt) {
  let targetRadius = 46;
  if (isALong || isAClicked) targetRadius = maxPetalRadius;
  if (isBLong || isBClicked) targetRadius = minPetalRadius;
  
  let sp = (targetRadius - currentPetalRadius) * 0.15;
  currentPetalRadius += sp * dt;
  if(Math.abs(targetRadius - currentPetalRadius) < 0.1) currentPetalRadius = targetRadius;

  if (joy.act) {
    P.vx += joy.dx * P.accel * dt;
    P.vy += joy.dy * P.accel * dt;
    joyFixedStill = 0;
  }
  P.vx *= Math.pow(P.friction, dt);
  P.vy *= Math.pow(P.friction, dt);
  let spd = Math.hypot(P.vx, P.vy);
  if (spd > P.maxSpeed) {
    P.vx = P.vx / spd * P.maxSpeed;
    P.vy = P.vy / spd * P.maxSpeed;
  }
  P.x += P.vx * dt;
  P.y += P.vy * dt;
  clampBound(P, true);

  // 主血条极度顺滑衰减（红血条快，假血条极慢）
  if (P.displayHp > P.hp) {
    P.displayHp = Math.max(P.hp, P.displayHp - Math.max(0.3, (P.displayHp - P.hp) * 0.1) * dt);
    cur.hpBarDisplay = Math.max(P.hp, cur.hpBarDisplay - Math.max(1.5, (cur.hpBarDisplay - P.hp) * 0.3) * dt);
  }
  if (P.displayHp < P.hp) P.displayHp = P.hp;
  if (cur.hpBarDisplay < P.hp) cur.hpBarDisplay = P.hp;

  P.ang += .04 * dt;
  P.pts.forEach(p => {
    p.o += shortestAngle(p.o, p.targetO) * 0.15 * dt;
    
    if (p.cd > 0) {
      p.cd -= dt;
      p.appear = Math.max(0, p.appear - 0.35 * dt);
      if (p.cd <= 0) p.pop = 1;
    } else {
      p.appear = Math.min(1, p.appear + 0.08 * dt);
    }
    if (p.pop > 0) p.pop = Math.max(0, p.pop - 0.08 * dt);
  });

  if (M.length < 15 && Math.random() < .05) spawn();

  for (let i = 0; i < M.length; i++) {
    for (let j = i + 1; j < M.length; j++) {
      let m1 = M[i], m2 = M[j];
      if (m1.dying || m2.dying) continue;
      let dx = m2.x - m1.x, dy = m2.y - m1.y;
      let d = Math.hypot(dx, dy);
      let minD = m1.r + m2.r;
      if (d < minD && d > 0) {
        let overlap = minD - d;
        let nx = dx / d, ny = dy / d;
        m1.x -= nx * overlap * 0.5;
        m1.y -= ny * overlap * 0.5;
        m2.x += nx * overlap * 0.5;
        m2.y += ny * overlap * 0.5;
        
        if (m1.vx !== undefined && m2.vx !== undefined) {
          let rvx = m2.vx - m1.vx, rvy = m2.vy - m1.vy;
          let velAlongNormal = rvx * nx + rvy * ny;
          if (velAlongNormal < 0) {
            let e = 0.8;
            let jImpulse = -(1 + e) * velAlongNormal / 2;
            m1.vx -= jImpulse * nx * 0.2;
            m1.vy -= jImpulse * ny * 0.2;
            m2.vx += jImpulse * nx * 0.2;
            m2.vy += jImpulse * ny * 0.2;
          }
        }
      }
    }
  }

  for (let i = M.length - 1; i >= 0; i--) {
    let m = M[i];
    if (m.dying) {
      m.fadeOut += 0.2 * dt;
      if (m.fadeOut >= 1) M.splice(i, 1);
      continue;
    }
    if (m.appear < 1) m.appear = Math.min(1, m.appear + 0.1 * dt);
    if (m.fl > 0) m.fl -= dt;
    if (m.acd > 0) m.acd -= dt;
    if (m.redFlash > 0) m.redFlash -= 0.15 * dt;

    // 怪物血条双色衰减
    if (m.displayHp > m.hp) {
      m.displayHp = Math.max(m.hp, m.displayHp - Math.max(0.3, (m.displayHp - m.hp) * 0.1) * dt);
      m.displayHpRed = Math.max(m.hp, m.displayHpRed - Math.max(1.5, (m.displayHpRed - m.hp) * 0.3) * dt);
    }
    if (m.displayHp < m.hp) m.displayHp = m.hp;
    if (m.displayHpRed < m.hp) m.displayHpRed = m.hp;

    let dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy);
    if (m.ai === 2 && d < 250) m.state = 1;
    
    if (m.state === 1) {
      if (d > 1) {
        m.vx += (dx / d) * 0.2 * dt;
        m.vy += (dy / d) * 0.2 * dt;
      }
    } else if (m.ai === 1 || m.ai === 2 || m.ai === 3) {
      m.wanderAngle += rnd(-0.1, 0.1);
      m.vx += Math.cos(m.wanderAngle) * 0.1 * dt;
      m.vy += Math.sin(m.wanderAngle) * 0.1 * dt;
    }
    
    m.vx *= Math.pow(0.9, dt);
    m.vy *= Math.pow(0.9, dt);
    let mSpd = Math.hypot(m.vx, m.vy);
    let limitSpd = m.state === 1 ? m.chSp : m.sp;
    if (mSpd > limitSpd) {
      m.vx = m.vx / mSpd * limitSpd;
      m.vy = m.vy / mSpd * limitSpd;
    }
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    if (clampBound(m, false)) {
      m.wanderAngle += Math.PI * (0.6 + Math.random() * 0.8);
    }

    if (d < m.r + P.r) {
      let angle = Math.atan2(P.y - m.y, P.x - m.x);
      let overlap = (m.r + P.r) - d;
      P.x += Math.cos(angle) * overlap * 0.2;
      P.y += Math.sin(angle) * overlap * 0.2;
      m.x -= Math.cos(angle) * overlap * 0.8;
      m.y -= Math.sin(angle) * overlap * 0.8;
      
      P.vx += Math.cos(angle) * 0.5;
      P.vy += Math.sin(angle) * 0.5;
      m.vx -= Math.cos(angle) * 0.5;
      m.vy -= Math.sin(angle) * 0.5;
      
      if (m.acd <= 0) {
        P.hp -= 8;
        P.fl = 4;
        m.acd = 7;
        P.redFlash = 1;
        if (settings.hpBarCfg.showDmg) {
          // 从主角中心弹出伤害
          spawnDmgText(P.x, P.y, '-8', '#ff6b6b');
        }
      }
    }
    for (let p of P.pts) {
      if (p.cd > 0) continue;
      let a = P.ang + p.o;
      let px = P.x + Math.cos(a) * currentPetalRadius;
      let py = P.y + Math.sin(a) * currentPetalRadius;
      if (dst({ x: px, y: py }, m) < p.r + m.r) {
        m.hp -= 12;
        m.fl = 8;
        m.redFlash = 1;
        p.cd = 20;
        if (m.ai === 3) m.state = 1;
        
        let kbAngle = Math.atan2(m.y - P.y, m.x - P.x);
        m.vx += Math.cos(kbAngle) * 0.5;
        m.vy += Math.sin(kbAngle) * 0.5;

        if (settings.monstCfg.showDmg) {
          // 从怪物中心弹出伤害
          spawnDmgText(m.x, m.y, '-12', '#ffd93d');
        }
        break;
      }
    }
    if (m.hp <= 0 && !m.dying) {
      m.dying = true;
      D.push({ x: m.x, y: m.y, r: 10, t: 30 });
    }
  }

  for (let i = DMG_TEXTS.length - 1; i >= 0; i--) {
    let d = DMG_TEXTS[i];
    if (d.life > 0) {
      d.alpha = Math.min(1, d.alpha + 0.3 * dt);
      d.scale += (1 - d.scale) * 0.4 * dt;
      d.x += d.vx * dt * 1.5;
      d.y += d.vy * dt * 1.5;
      d.vy += 0.2 * dt;
      d.life -= 0.04 * dt;
      if (d.life <= 0) d.life = 0;
    } else {
      d.alpha -= 0.1 * dt;
      if (d.alpha <= 0) DMG_TEXTS.splice(i, 1);
    }
  }

  for (let i = D.length - 1; i >= 0; i--) {
    let d = D[i];
    d.t -= dt / 60;
    if (dst(d, P) < P.r + d.r) {
      P.n = Math.min(P.n + 1, 10);
      initP(P.n, 30); // 拾取时新花瓣进入冷却，像挤出来一样
      D.splice(i, 1);
    } else if (d.t <= 0) {
      D.splice(i, 1);
    }
  }

  if (P.hp <= 0) {
    P.hp = P.mhp;
    P.displayHp = P.mhp;
    cur.hpBarDisplay = P.mhp;
    P.x = WORLD / 2;
    P.y = WORLD / 2;
    P.vx = 0;
    P.vy = 0;
    M.length = 0;
    P.n = 5;
    initP(5);
  }
  if (P.fl > 0) P.fl -= dt;
  if (P.redFlash > 0) P.redFlash -= 0.15 * dt;

  const movingNow = joy.act || Math.hypot(P.vx, P.vy) > 0.2;
  if (movingNow) {
    P.stillTimer = 0;
    P.arrowAlpha = Math.min(1, P.arrowAlpha + 0.08 * dt);
    if (joy.act && (Math.abs(joy.dx) > 0.05 || Math.abs(joy.dy) > 0.05)) {
      P.arrowTargetAngle = Math.atan2(joy.dy, joy.dx);
    }
  } else {
    P.stillTimer += dt / 60;
    if (P.stillTimer >= 50) {
      P.arrowAlpha = Math.max(0, P.arrowAlpha - 0.02 * dt);
    }
  }
  P.arrowAngle += shortestAngle(P.arrowAngle, P.arrowTargetAngle) * Math.min(1, 0.55 * dt);
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (settings.isLayoutMode) {
    drawGridScreen();
    drawPlayer(W/2, H/2, true);
    
    // 仅画元素边缘的高亮，去掉外圈大黄线
    ctx.globalAlpha = settings.pPreviewCfg.alpha;
    if (settings.pPreviewCfg.showHpBar) {
      let w = 30, barY = H/2 + P.r + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(W/2 - w / 2, barY, w, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#f44';
      ctx.beginPath();
      ctx.roundRect(W/2 - w / 2, barY, w * 0.5, 4, 2);
      ctx.fill();
      if (settings.pPreviewCfg.showHpNum) {
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('50/100', W/2, barY - 4);
      }
    }
    ctx.globalAlpha = 1;

    if (hl.pPreview > 0.01) {
      ctx.save();
      ctx.globalAlpha = hl.pPreview;
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(W/2, H/2, P.r + 4, 0, 7); // 紧贴边缘
      ctx.stroke();
      ctx.restore();
    }

    let fx = W / 2 + 100, fy = H / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, 20, 0, 7);
    ctx.fillStyle = '#888';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (hl.fakeMonster > 0.01) {
      ctx.save();
      ctx.globalAlpha = hl.fakeMonster;
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(fx, fy, 20 + 4, 0, 7); // 紧贴边缘
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalAlpha = settings.monstCfg.alpha;
    if (settings.monstCfg.showHpBar) {
      let w = 30, barY = fy + 20 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(fx - w / 2, barY, w, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#f44';
      ctx.beginPath();
      ctx.roundRect(fx - w / 2, barY, w * 0.5, 4, 2);
      ctx.fill();
      if (settings.monstCfg.showHpNum) {
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('20/40', fx, barY - 4);
      }
    }
    ctx.globalAlpha = 1;

    let jy = uiPos.joy.y !== null ? uiPos.joy.y : FY;
    drawJoy(uiPos.joy.x, jy, uiPos.joy.x, jy, 0, 0, 1, true);

    if (hl.joy > 0.01) {
      ctx.save();
      ctx.globalAlpha = hl.joy;
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(uiPos.joy.x, jy, JR * cur.joySize + 4, 0, 7); // 紧贴边缘
      ctx.stroke();
      ctx.restore();
    }

    drawPlayerHUD();
    drawMinimap();
    return;
  }

  cam.x = P.x - W / 2;
  cam.y = P.y - H / 2;

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  drawGridWorld();

  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(MARGIN, MARGIN, WORLD - MARGIN * 2, WORLD - MARGIN * 2, 30);
  ctx.stroke();

  D.forEach(d => {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, 7);
    ctx.fillStyle = '#ffd93d';
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,120,0,.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  M.forEach(m => {
    let alpha = m.dying ? (1 - m.fadeOut) : m.appear;
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, 7);
    
    if (m.redFlash > 0) {
      ctx.fillStyle = `rgba(255, 100, 100, ${m.redFlash})`;
    } else {
      ctx.fillStyle = m.fl > 0 ? '#fff' : m.c;
    }
    ctx.fill();
    
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    if (m.hp < m.mhp && !m.dying) {
      let w = m.r * 1.5, barY = m.y + m.r + 4;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(m.x - w / 2, barY, w, 4, 2);
      ctx.fill();
      
      if (m.displayHpRed > 0) {
        ctx.fillStyle = '#7d1a1a';
        ctx.beginPath();
        ctx.roundRect(m.x - w / 2, barY, w * (m.displayHpRed / m.mhp), 4, 2);
        ctx.fill();
      }
      if (m.displayHp > 0) {
        ctx.fillStyle = '#e05353';
        ctx.beginPath();
        ctx.roundRect(m.x - w / 2, barY, w * (m.displayHp / m.mhp), 4, 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  });

  P.pts.forEach(p => {
    if (p.cd > 0 && p.appear <= 0.01) return;
    let a = P.ang + p.o;
    let baseDist = currentPetalRadius;
    let dist = baseDist;
    if (p.pop > 0) {
      dist = P.r + (baseDist - P.r) * (1 - p.pop);
      if (dist < P.r) dist = P.r;
    }
    let px = P.x + Math.cos(a) * dist;
    let py = P.y + Math.sin(a) * dist;
    let alpha = p.cd > 0 ? p.appear : 1;
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, 7);
    ctx.fillStyle = '#ff6b9d';
    ctx.fill();
    ctx.strokeStyle = '#8a2e52';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  drawPlayer(P.x, P.y);

  DMG_TEXTS.forEach(d => {
    ctx.save();
    ctx.globalAlpha = d.alpha;
    ctx.translate(d.x, d.y);
    ctx.scale(d.scale, d.scale);
    ctx.fillStyle = d.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 3;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(d.text, 0, 0);
    ctx.fillText(d.text, 0, 0);
    ctx.restore();
  });

  ctx.restore();

  if (settings.showUI) {
    drawJoy(joy.bx, joy.by, joy.displayKx, joy.displayKy, joy.dx, joy.dy, joy.visAlpha, false);
    drawPlayerHUD();
    drawMinimap();
  }
}

function drawGridWorld() {
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  let startX = Math.floor(cam.x / 40) * 40;
  let startY = Math.floor(cam.y / 40) * 40;
  for (let x = startX; x < cam.x + W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, cam.y);
    ctx.lineTo(x, cam.y + H);
    ctx.stroke();
  }
  for (let y = startY; y < cam.y + H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(cam.x, y);
    ctx.lineTo(cam.x + W, y);
    ctx.stroke();
  }
}

function drawGridScreen() {
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, H);
    ctx.stroke();
  }
  for (let i = 0; i < H; i += 40) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(W, i);
    ctx.stroke();
  }
}

function drawPlayer(x, y, layoutPreview) {
  ctx.beginPath();
  ctx.arc(x, y, P.r, 0, 7);
  if (P.redFlash > 0 && !layoutPreview) {
    ctx.fillStyle = `rgba(255, 100, 100, ${P.redFlash})`;
  } else {
    ctx.fillStyle = '#4dabf7';
  }
  ctx.fill();
  ctx.strokeStyle = '#163f63';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (layoutPreview) return;

  if (P.arrowAlpha > 0.01) {
    let angle = settings.isLayoutMode ? -Math.PI / 2 : P.arrowAngle;
    let dist = P.r + 15;
    ctx.save();
    ctx.globalAlpha = P.arrowAlpha;
    ctx.translate(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist);
    ctx.rotate(angle);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 1.5;
    if (settings.arrowStyle === 1) {
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-4, -6);
      ctx.lineTo(-4, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (settings.arrowStyle === 2) {
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.arcTo(-4, -6, -4, 6, 3);
      ctx.arcTo(-4, 6, 8, 0, 3);
      ctx.arcTo(8, 0, -4, -6, 3);
      ctx.fill();
      ctx.stroke();
    } else if (settings.arrowStyle === 3) {
      ctx.beginPath();
      ctx.arc(0, 0, 8, -Math.PI / 2, Math.PI / 2);
      ctx.arc(-4, 0, 6, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (settings.arrowStyle === 4) {
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.quadraticCurveTo(-5, 10, -2, 0);
      ctx.quadraticCurveTo(-5, -10, 10, 0);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawPlayerHUD() {
  let aScale = cur.avatarSize;
  let aAlpha = cur.avatarAlpha;
  let avX = uiPos.avatar.x;
  let avY = uiPos.avatar.y;
  let avR = 20 * aScale;

  ctx.globalAlpha = aAlpha;
  ctx.beginPath();
  ctx.arc(avX, avY, avR, 0, 7);
  if (P.redFlash > 0) {
    ctx.fillStyle = `rgba(255, 100, 100, ${P.redFlash})`;
  } else {
    ctx.fillStyle = '#4dabf7';
  }
  ctx.fill();
  ctx.strokeStyle = '#163f63';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (hl.avatar > 0.01) {
    ctx.save();
    ctx.globalAlpha = hl.avatar;
    ctx.strokeStyle = '#ffd93d';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(avX, avY, avR + 4, 0, 7);
    ctx.stroke();
    ctx.restore();
  }

  let hScale = cur.hpSize;
  let hAlpha = cur.hpAlpha;
  let barX = uiPos.hpBar.x;
  let barY = uiPos.hpBar.y;
  let barW = 120 * hScale;
  let barH = 24 * hScale;
  let halfH = barH / 2;

  ctx.globalAlpha = hAlpha;

  function roundRect(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  roundRect(barX - barW / 2, barY - halfH, barW, barH, 10 * hScale);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  if (P.displayHp > 0) {
    roundRect(barX - barW / 2, barY - halfH, barW * (P.displayHp / P.mhp), barH, 10 * hScale);
    ctx.fillStyle = '#7d1a1a';
    ctx.fill();
  }
  if (cur.hpBarDisplay > 0) {
    roundRect(barX - barW / 2, barY - halfH, barW * (cur.hpBarDisplay / P.mhp), barH, 10 * hScale);
    ctx.fillStyle = '#e05353';
    ctx.fill();
  }
  if (settings.hpBarCfg.showNumber) {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${14 * hScale}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let shown = Math.round(P.hp * 10) / 10;
    ctx.fillText(`${shown}/${P.mhp}`, barX, barY + 1);
  }
  ctx.globalAlpha = 1;

  if (hl.hpBar > 0.01) {
    ctx.save();
    ctx.globalAlpha = hl.hpBar;
    ctx.strokeStyle = '#ffd93d';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    roundRect(barX - barW / 2 - 4, barY - halfH - 4, barW + 8, barH + 8, 12 * hScale);
    ctx.stroke();
    ctx.restore();
  }
}

let mapZoom = 0;
let mapTransitioning = false;

function applyMapZoom(animate) {
  if (settings.isLayoutMode) {
    // 自定义键位里千万不要触发缩放和位置改变，防止闪现
    return;
  }
  
  if (mapZoom === 0) {
    minimapContainer.style.width = (80 * settings.mapCfg.size) + 'px';
    minimapContainer.style.height = (80 * settings.mapCfg.size) + 'px';
    minimapContainer.style.top = '20px';
    minimapContainer.style.left = 'auto';
    minimapContainer.style.right = '80px';
    minimapContainer.style.transform = 'none';
  } else if (mapZoom === 1) {
    const baseW = 140, baseH = 140;
    const dir = settings.mapCfg.expandDir;
    minimapContainer.style.width = (baseW * settings.mapCfg.size) + 'px';
    minimapContainer.style.height = (baseH * settings.mapCfg.size) + 'px';
    if (dir === 'lefttop') {
      minimapContainer.style.top = '20px';
      minimapContainer.style.right = (80 + (baseW - 80)) + 'px';
      minimapContainer.style.left = 'auto';
    } else if (dir === 'righttop') {
      minimapContainer.style.top = '20px';
      minimapContainer.style.right = '80px';
      minimapContainer.style.left = 'auto';
    } else if (dir === 'leftbottom') {
      minimapContainer.style.top = (20 + (baseH - 80)) + 'px';
      minimapContainer.style.right = (80 + (baseW - 80)) + 'px';
      minimapContainer.style.left = 'auto';
    } else {
      minimapContainer.style.top = (20 + (baseH - 80)) + 'px';
      minimapContainer.style.right = '80px';
      minimapContainer.style.left = 'auto';
    }
    minimapContainer.style.transform = 'none';
  } else {
    const baseW = 260, baseH = 260;
    minimapContainer.style.width = baseW + 'px';
    minimapContainer.style.height = baseH + 'px';
    minimapContainer.style.top = '50%';
    minimapContainer.style.left = '50%';
    minimapContainer.style.right = 'auto';
    minimapContainer.style.transform = 'translate(-50%,-50%)';
  }
  if (animate) {
    mapTransitioning = true;
    setTimeout(() => {
      mapTransitioning = false;
      syncMinimapSize();
    }, 320);
  } else {
    syncMinimapSize();
  }
}

minimapContainer.addEventListener('click', () => {
  if (settings.isLayoutMode) return;
  if (mapTransitioning) return;
  mapZoom = (mapZoom + 1) % 3;
  applyMapZoom(true);
});

function drawMinimap() {
  const w = minimapCanvas.width, h = minimapCanvas.height;
  if (w < 2 || h < 2) return;
  const sx = w / WORLD, sy = h / WORLD;
  mmCtx.clearRect(0, 0, w, h);
  mmCtx.fillStyle = 'rgba(0,0,0,0.5)';
  mmCtx.fillRect(0, 0, w, h);

  const dotR = 2;
  mmCtx.fillStyle = '#f44';
  M.forEach(m => {
    mmCtx.beginPath();
    mmCtx.arc(m.x * sx, m.y * sy, dotR, 0, 7);
    mmCtx.fill();
  });
  mmCtx.fillStyle = '#4dabf7';
  mmCtx.beginPath();
  mmCtx.arc(P.x * sx, P.y * sy, dotR, 0, 7);
  mmCtx.fill();
}

function drawJoy(bx, by, kx, ky, dx, dy, alpha, isLayout) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha * cur.joyAlpha;
  let size = cur.joySize;
  let jr = JR * size, kr = KR * size;
  
  ctx.beginPath();
  ctx.arc(bx, by, jr, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  if (settings.joyCfg.showHead) {
    let scale = joy.act && !isLayout ? 0.9 : 1;
    ctx.globalAlpha = alpha * cur.joyAlpha;
    ctx.beginPath();
    ctx.arc(kx, ky, kr * scale, 0, 7);
    ctx.fillStyle = 'rgba(77,171,247,0.8)';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = alpha * cur.joyAlpha;
  }
  ctx.globalAlpha = 1;
}

let draggingUI = null, dragUIStartX, dragUIStartY, dragUIInitX, dragUIInitY;
cvs.addEventListener('touchstart', e => {
  if (!settings.isLayoutMode) return;
  const t = e.changedTouches[0];
  const tx = t.clientX, ty = t.clientY;

  let avR = 20 * cur.avatarSize;
  if (Math.hypot(tx - uiPos.avatar.x, ty - uiPos.avatar.y) < avR + 15) {
    selectUIElement('avatar');
    draggingUI = 'avatar';
    dragUIStartX = tx;
    dragUIStartY = ty;
    dragUIInitX = uiPos.avatar.x;
    dragUIInitY = uiPos.avatar.y;
    e.preventDefault();
    return;
  }

  let hScale = cur.hpSize;
  let barW = 120 * hScale, barH = 24 * hScale;
  let barX = uiPos.hpBar.x, barY = uiPos.hpBar.y;
  if (tx >= barX - barW / 2 - 6 && tx <= barX + barW / 2 + 6 && ty >= barY - barH / 2 - 6 && ty <= barY + barH / 2 + 6) {
    selectUIElement('hpBar');
    draggingUI = 'hpBar';
    dragUIStartX = tx;
    dragUIStartY = ty;
    dragUIInitX = uiPos.hpBar.x;
    dragUIInitY = uiPos.hpBar.y;
    e.preventDefault();
    return;
  }

  let jr = JR * cur.joySize;
  let jx = uiPos.joy.x;
  let jy = uiPos.joy.y !== null ? uiPos.joy.y : FY;
  if (Math.hypot(tx - jx, ty - jy) < jr + 15) {
    selectUIElement('joy');
    draggingUI = 'joy';
    dragUIStartX = tx;
    dragUIStartY = ty;
    dragUIInitX = jx;
    dragUIInitY = jy;
    e.preventDefault();
    return;
  }

  if (Math.hypot(tx - W/2, ty - H/2) < P.r + 15) {
    selectUIElement('pPreview');
    e.preventDefault();
    return;
  }

  let pBarY = H/2 + P.r + 6;
  if (tx >= W/2 - 15 - 10 && tx <= W/2 + 15 + 10 && ty >= pBarY - 10 && ty <= pBarY + 4 + 10) {
    selectUIElement('pPreviewHp');
    e.preventDefault();
    return;
  }

  let fx = W / 2 + 100, fy = H / 2;
  let fw = 30, fbarY = fy + 20 + 6;
  if (
    Math.hypot(tx - fx, ty - fy) < 20 + 15 ||
    (tx >= fx - fw / 2 && tx <= fx + fw / 2 && ty >= fbarY && ty <= fbarY + 4 + 8)
  ) {
    selectUIElement('fakeMonster');
    e.preventDefault();
    return;
  }
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  if (!draggingUI) return;
  const t = e.changedTouches[0];
  const tx = t.clientX, ty = t.clientY;
  let nx = dragUIInitX + (tx - dragUIStartX);
  let ny = dragUIInitY + (ty - dragUIStartY);
  if (draggingUI === 'avatar') {
    uiPos.avatar.x = nx;
    uiPos.avatar.y = ny;
  } else if (draggingUI === 'hpBar') {
    uiPos.hpBar.x = nx;
    uiPos.hpBar.y = ny;
  } else if (draggingUI === 'joy') {
    uiPos.joy.x = nx;
    uiPos.joy.y = ny;
  }
  e.preventDefault();
}, { passive: false });

cvs.addEventListener('touchend', () => {
  draggingUI = null;
});

requestAnimationFrame(loop);
</script>
